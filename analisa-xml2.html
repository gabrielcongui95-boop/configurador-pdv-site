            if (!infNFe) return erros;
            
            const dets = [];
            const detsFromNS = infNFe.getElementsByTagNameNS(NS_NFE, 'det');
            if (detsFromNS.length > 0) {
                for (let i = 0; i < detsFromNS.length; i++) dets.push(detsFromNS[i]);
            } else {
                const detsFromTag = infNFe.getElementsByTagName('det');
                for (let i = 0; i < detsFromTag.length; i++) dets.push(detsFromTag[i]);
            }
            
            dets.forEach(det => {
                const prod = getElemento(det, 'prod');
                const imposto = getElemento(det, 'imposto');
                const icmsContainer = imposto ? getElemento(imposto, 'ICMS') : null;
                
                if (prod) {
                    const vProd = parseFloat(getTextoElemento(prod, 'vProd')) || 0;
                    somaVProd += vProd;
                }
                
                if (icmsContainer) {
                    const icmsTags = ['ICMS00', 'ICMS10', 'ICMS20', 'ICMS40', 'ICMS41', 'ICMS60', 
                                      'ICMS90', 'ICMS30', 'ICMS50', 'ICMS51', 'ICMS53', 'ICMS70'];
                    let vICMS = 0;
                    for (let tag of icmsTags) {
                        const elem = getElemento(icmsContainer, tag);
                        if (elem) {
                            vICMS = parseFloat(getTextoElemento(elem, 'vICMS')) || 0;
                            break;
                        }
                    }
                    const csosnTags = ['ICMSSN102','ICMSSN103','ICMSSN201','ICMSSN202','ICMSSN500','ICMSSN900'];
                    for (let tag of csosnTags) {
                        const elem = getElemento(icmsContainer, tag);
                        if (elem) {
                            vICMS = parseFloat(getTextoElemento(elem, 'vICMS')) || 0;
                            break;
                        }
                    }
                    somaVICMS += vICMS;
                }
            });
            
            const total = getElemento(infNFe, 'total');
            const icmsTot = total ? getElemento(total, 'ICMSTot') : null;
            if (icmsTot) {
                const vProdTotal = parseFloat(getTextoElemento(icmsTot, 'vProd')) || 0;
                const vICMSTotal = parseFloat(getTextoElemento(icmsTot, 'vICMS')) || 0;
                
                const somaVProdArred = Math.round(somaVProd * 100) / 100;
                const vProdTotalArred = Math.round(vProdTotal * 100) / 100;
                if (Math.abs(somaVProdArred - vProdTotalArred) > 0.01) {
                    erros.push({
                        erro: 'Rejeição 528',
                        mensagem: `Total de vProd no ICMSTot (${vProdTotal.toFixed(2)}) difere da soma dos itens (${somaVProdArred.toFixed(2)})`,
                        item: null
                    });
                }
                
                const somaVICMSArred = Math.round(somaVICMS * 100) / 100;
                const vICMSTotalArred = Math.round(vICMSTotal * 100) / 100;
                if (Math.abs(somaVICMSArred - vICMSTotalArred) > 0.01) {
                    erros.push({
                        erro: 'Rejeição 531',
                        mensagem: `Total de vICMS no ICMSTot (${vICMSTotal.toFixed(2)}) difere da soma dos itens (${somaVICMSArred.toFixed(2)})`,
                        item: null
                    });
                }
            }
            
            return erros;
        }
        
        /**
         * Valida o telefone do emitente
         * @param {string} fone - Telefone do emitente
         * @returns {Array} Lista de erros encontrados
         */
        function validarTelefoneEmitente(fone) {
            const erros = [];
            if (!fone) return erros;
            
            // Remove caracteres não numéricos
            const foneLimpo = fone.replace(/\D/g, '');
            
            if (foneLimpo.length < 8) {
                erros.push({
                    erro: 'Telefone Inválido',
                    mensagem: 'Erro: Telefone do emitente inválido. Deve conter pelo menos 8 dígitos.',
                    item: null
                });
            }
            
            return erros;
        }

        /**
         * Valida o NCM usando a Brasil API (mais confiável)
         * @param {string} ncm - NCM a ser validado
         * @returns {Promise<{valido: boolean, descricao?: string}>} Resultado da validação
         */
        async function validarNCM(ncm) {
            if (!ncm) {
                return { valido: false };
            }

            // Sanitiza o NCM (remove caracteres não numéricos)
            const ncmLimpo = ncm.replace(/\D/g, '');

            // Valida comprimento (NCM deve ter 8 dígitos)
            if (ncmLimpo.length !== 8) {
                return { valido: false };
            }

            try {
                // Consulta a Brasil API para verificar se o NCM existe
                const response = await fetch(`https://brasilapi.com.br/api/ncm/v1/${ncmLimpo}`);
                
                if (!response.ok) {
                    return { valido: false };
                }

                const data = await response.json();
                
                // Se a API retornar dados, o NCM é válido
                if (data && data.codigo) {
                    return { 
                        valido: true, 
                        descricao: data.descricao 
                    };
                }

                return { valido: false };
            } catch (error) {
                // Se houver erro na requisição (ex: sem conexão), não exibe falso alerta
                log(`Erro ao validar NCM ${ncmLimpo}: ${error.message}`, 'warn');
                return { valido: true }; // Assume válido se a API estiver indisponível
            }
        }
        
        /**
         * Normaliza texto para comparação (remove acentos e converte para maiúsculas)
         * @param {string} texto - Texto a ser normalizado
         * @returns {string} Texto normalizado
         */
        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
        }
        
        /**
         * Sanitiza e valida CEP, consulta ViaCEP e compara dados
         * @param {string} cep - CEP a ser validado
         * @param {string} tipo - 'emitente' ou 'destinatario'
         * @param {string} ufXML - UF do XML
         * @param {string} xMunXML - Município do XML
         * @param {string} xLgrXML - Logradouro do XML
         * @returns {Promise<Array>} Lista de erros encontrados
         */
        async function validarCEP(cep, tipo, ufXML, xMunXML, xLgrXML, xBairroXML) {
            const erros = [];
            
            // Sanitiza o CEP (remove caracteres não numéricos)
            const cepLimpo = cep.replace(/\D/g, '');
            const cepValido = cepLimpo.length === 8;
            
            try {
                if (cepValido) {
                    // Primeiro, tenta CEP → Endereço
                    const responseCEP = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                    const dataCEP = await responseCEP.json();
                    
                    if (!dataCEP.erro) {
                        // CEP válido, compara endereço
                        const enderecoCorreto = `${dataCEP.logradouro}${dataCEP.bairro ? ', ' + dataCEP.bairro : ''}${dataCEP.localidade ? ', ' + dataCEP.localidade : ''} - ${dataCEP.uf}, CEP: ${dataCEP.cep}`;
                        
                        // Compara UF
                        const ufXMLLimpo = normalizarTexto(ufXML);
                        const ufAPILimpo = normalizarTexto(dataCEP.uf);
                        if (ufXMLLimpo && ufAPILimpo && ufXMLLimpo !== ufAPILimpo) {
                            erros.push({
                                erro: 'Divergência de UF',
                                mensagem: `UF do ${tipo} diverge: XML = ${ufXML}, Correios = ${dataCEP.uf}. Endereço correto: ${enderecoCorreto}`,
                                item: null
                            });
                        }
                        
                        // Compara Município
                        const xMunXMLLimpo = normalizarTexto(xMunXML);
                        const xMunAPILimpo = normalizarTexto(dataCEP.localidade);
                        if (xMunXMLLimpo && xMunAPILimpo && xMunXMLLimpo !== xMunAPILimpo) {
                            erros.push({
                                erro: 'Divergência de Município',
                                mensagem: `Município do ${tipo} diverge: XML = ${xMunXML}, Correios = ${dataCEP.localidade}. Endereço correto: ${enderecoCorreto}`,
                                item: null
                            });
                        }
                        
                        // Compara Logradouro
                        const xLgrXMLLimpo = normalizarTexto(xLgrXML);
                        const xLgrAPILimpo = normalizarTexto(dataCEP.logradouro);
                        if (xLgrXMLLimpo && xLgrAPILimpo && xLgrXMLLimpo !== xLgrAPILimpo) {
                            erros.push({
                                erro: 'Divergência de Logradouro',
                                mensagem: `Logradouro do ${tipo} diverge: XML = ${xLgrXML}, Correios = ${dataCEP.logradouro}. Endereço correto: ${enderecoCorreto}`,
                                item: null
                            });
                        }
                        
                        return erros;
                    }
                }
                
                // Se chegamos aqui: CEP é inválido, vazio ou não encontrado → tenta Endereço → CEP
                if (ufXML && xMunXML && xLgrXML) {
                    // Prepara URL para consulta reversa (ViaCEP: /ws/{UF}/{cidade}/{logradouro}/json/)
                    const ufCodificado = encodeURIComponent(ufXML);
                    const cidadeCodificada = encodeURIComponent(xMunXML);
                    const logradouroCodificado = encodeURIComponent(xLgrXML);
                    const responseEndereco = await fetch(`https://viacep.com.br/ws/${ufCodificado}/${cidadeCodificada}/${logradouroCodificado}/json/`);
                    const dataEndereco = await responseEndereco.json();
                    
                    if (dataEndereco && dataEndereco.length > 0) {
                        // Encontramos CEPs para este endereço!
                        const primeiroResultado = dataEndereco[0];
                        const enderecoCorreto = `${primeiroResultado.logradouro}${primeiroResultado.bairro ? ', ' + primeiroResultado.bairro : ''}${primeiroResultado.localidade ? ', ' + primeiroResultado.localidade : ''} - ${primeiroResultado.uf}, CEP: ${primeiroResultado.cep}`;
                        const cepSugerido = primeiroResultado.cep;
                        
                        if (cepValido) {
                            erros.push({
                                erro: 'CEP Incorreto',
                                mensagem: `CEP informado (${cep}) não corresponde ao endereço. CEP correto sugerido: ${cepSugerido}. Endereço completo: ${enderecoCorreto}`,
                                item: null
                            });
                        } else {
                            erros.push({
                                erro: 'CEP em Branco ou Inválido',
                                mensagem: `CEP não informado ou inválido. CEP sugerido para o endereço: ${cepSugerido}. Endereço completo: ${enderecoCorreto}`,
                                item: null
                            });
                        }
                    } else if (cepValido) {
                        erros.push({
                            erro: 'Rejeição CEP Incorreto',
                            mensagem: `Rejeição : CEP ${cep} informado no ${tipo} não existe na base dos Correios.`,
                            item: null
                        });
                    } else {
                        log(`Não foi possível encontrar CEP para o endereço: ${ufXML}, ${xMunXML}, ${xLgrXML}`, 'warn');
                    }
                } else if (cepValido) {
                    erros.push({
                        erro: 'Rejeição CEP Incorreto',
                        mensagem: `Rejeição : CEP ${cep} informado no ${tipo} não existe na base dos Correios.`,
                        item: null
                    });
                }
                
            } catch (error) {
                log(`Erro ao consultar ViaCEP para ${tipo}: ${error.message}`, 'error');
                // Não adiciona erro se a API estiver indisponível
            }
            
            return erros;
        }
        
        /**
         * Executa todas as novas validações
         * @param {Document} xmlDoc - Documento XML parseado
         * @param {string} NS_NFE - Namespace da NF-e
         * @param {object} dados - Dados extraídos do XML
         * @returns {Promise<Array>} Lista com todos os erros encontrados
         */
        async function executarNovasValidacoes(xmlDoc, NS_NFE, dados) {
            const todosErros = [];
            
            // Valida telefone do emitente
            const errosTelefone = validarTelefoneEmitente(dados.emit.fone);
            todosErros.push(...errosTelefone);
            
            // Valida chave de acesso (usando a já extraída em dados.ide.chaveAcesso)
            if (dados.ide.chaveAcesso) {
                const errosDV = validarDVChaveAcesso(dados.ide.chaveAcesso);
                todosErros.push(...errosDV);
            }
            
            const errosGTIN = validarGTINsItens(xmlDoc, NS_NFE);
            todosErros.push(...errosGTIN);
            
            const errosTotais = validarTotaisICMSProd(xmlDoc, NS_NFE);
            todosErros.push(...errosTotais);
            
            // Valida CEP do destinatário (se existir)
            if (dados.dest) {
                const errosCEPDest = await validarCEP(dados.dest.CEP, 'destinatario', dados.dest.UF, dados.dest.xMun, dados.dest.xLgr, dados.dest.xBairro);
                todosErros.push(...errosCEPDest);
            }
            
            return todosErros;
        }
        
        // ==========================================
        // PROCESSAMENTO GERAL
        // ==========================================
        function validarTotaisPISCOFINS(dados) {
            const mensagens = [];
            let total_pis_icms = 0;
            let total_cofins_icms = 0;
            let total_pis_issqn = 0;
            let total_cofins_issqn = 0;
            let total_vIBSUFRT = 0;
            let total_vIBSMunRT = 0;
            let total_vCBSRT = 0;
            
            // Somar valores dos itens
            dados.itens.forEach(item => {
                const vPIS = parseFloat(item.vPIS) || 0;
                const vCOFINS = parseFloat(item.vCOFINS) || 0;
                const vIBSUFRT = parseFloat(item.vIBSUFRT) || 0;
                const vIBSMunRT = parseFloat(item.vIBSMunRT) || 0;
                const vCBSRT = parseFloat(item.vCBSRT) || 0;
                
                if (item.temICMS) {
                    total_pis_icms += vPIS;
                    total_cofins_icms += vCOFINS;
                }
                if (item.temISSQN) {
                    total_pis_issqn += vPIS;
                    total_cofins_issqn += vCOFINS;
                }
                total_vIBSUFRT += vIBSUFRT;
                total_vIBSMunRT += vIBSMunRT;
                total_vCBSRT += vCBSRT;
            });
            
            // Arredondar para 2 casas decimais
            total_pis_icms = Math.round(total_pis_icms * 100) / 100;
            total_cofins_icms = Math.round(total_cofins_icms * 100) / 100;
            total_pis_issqn = Math.round(total_pis_issqn * 100) / 100;
            total_cofins_issqn = Math.round(total_cofins_issqn * 100) / 100;
            total_vIBSUFRT = Math.round(total_vIBSUFRT * 100) / 100;
            total_vIBSMunRT = Math.round(total_vIBSMunRT * 100) / 100;
            total_vCBSRT = Math.round(total_vCBSRT * 100) / 100;
            const total_vIBSRT = Math.round((total_vIBSUFRT + total_vIBSMunRT) * 100) / 100;
            
            // Comparar com ICMSTot (apenas para PIS/COFINS)
            const vPIS_icms_tot = parseFloat(dados.totals.icmstot.vPIS) || 0;
            const vCOFINS_icms_tot = parseFloat(dados.totals.icmstot.vCOFINS) || 0;
            
            if (Math.abs(total_pis_icms - vPIS_icms_tot) > 0.01) {
                mensagens.push({
                    tipo: 'error',
                    erro: 'Total PIS divergente',
                    desc: `Total do PIS nos itens (ICMS): R$ ${total_pis_icms.toFixed(2)} vs Total declarado em ICMSTot: R$ ${vPIS_icms_tot.toFixed(2)}`,
                    motivo: 'Soma dos valores de PIS dos itens com ICMS não confere com o total em ICMSTot',
                    correcao: 'Ajustar o valor vPIS em ICMSTot para corresponder à soma dos itens',
                    orientacao: 'Verificar os valores de PIS em cada item e o total declarado',
                    rejeicao: '602',
                    campos: ['vPIS (ICMSTot)']
                });
            }
            
            if (Math.abs(total_cofins_icms - vCOFINS_icms_tot) > 0.01) {
                mensagens.push({
                    tipo: 'error',
                    erro: 'Total COFINS divergente',
                    desc: `Total do COFINS nos itens (ICMS): R$ ${total_cofins_icms.toFixed(2)} vs Total declarado em ICMSTot: R$ ${vCOFINS_icms_tot.toFixed(2)}`,
                    motivo: 'Soma dos valores de COFINS dos itens com ICMS não confere com o total em ICMSTot',
                    correcao: 'Ajustar o % PIS e COFINS  para corresponder à soma dos itens',
                    orientacao: 'CST PIS e CST COFINS 06 e 07, que provavelmente não devem ter % de Pis ou Cofins',
                    rejeicao: '603',
                    campos: ['vCOFINS (ICMSTot)']
                });
            }
            
            // Validação de IBS/CBS usando IBSCBSTot
            if (dados.totals.ibscbstot) {
                const vIBS_ibscbs_tot = parseFloat(dados.totals.ibscbstot.vIBS) || 0;
                const vCBS_ibscbs_tot = parseFloat(dados.totals.ibscbstot.vCBS) || 0;
                const vIBSUF_ibscbs_tot = parseFloat(dados.totals.ibscbstot.vIBSUF) || 0;
                const vIBSMun_ibscbs_tot = parseFloat(dados.totals.ibscbstot.vIBSMun) || 0;
                
                if (Math.abs(total_vIBSRT - vIBS_ibscbs_tot) > 0.01) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'Total IBS divergente',
                        desc: `Total do IBS nos itens (vIBSUFRT + vIBSMunRT): R$ ${total_vIBSRT.toFixed(2)} vs Total declarado em IBSCBSTot/gIBS/vIBS: R$ ${vIBS_ibscbs_tot.toFixed(2)}`,
                        motivo: 'Soma dos valores de IBS dos itens (vIBSUFRT + vIBSMunRT) não confere com o total em IBSCBSTot',
                        correcao: 'Ajustar o valor vIBS em IBSCBSTot/gIBS para corresponder à soma dos itens',
                        orientacao: 'Verificar os valores de vIBSUFRT e vIBSMunRT em cada item e o total declarado em IBSCBSTot',
                        campos: ['vIBS (IBSCBSTot)']
                    });
                }
                
                if (Math.abs(total_vCBSRT - vCBS_ibscbs_tot) > 0.01) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'Total CBS divergente',
                        desc: `Total do CBS nos itens (vCBSRT): R$ ${total_vCBSRT.toFixed(2)} vs Total declarado em IBSCBSTot/gCBS/vCBS: R$ ${vCBS_ibscbs_tot.toFixed(2)}`,
                        motivo: 'Soma dos valores de CBS dos itens (vCBSRT) não confere com o total em IBSCBSTot',
                        correcao: 'Ajustar o valor vCBS em IBSCBSTot/gCBS para corresponder à soma dos itens',
                        orientacao: 'Verificar os valores de vCBSRT em cada item e o total declarado em IBSCBSTot',
                        campos: ['vCBS (IBSCBSTot)']
                    });
                }
                
                if (Math.abs(total_vIBSUFRT - vIBSUF_ibscbs_tot) > 0.01) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'Total IBSUF divergente',
                        desc: `Total do IBSUF nos itens (vIBSUFRT): R$ ${total_vIBSUFRT.toFixed(2)} vs Total declarado em IBSCBSTot/gIBS/gIBSUF/vIBSUF: R$ ${vIBSUF_ibscbs_tot.toFixed(2)}`,
                        motivo: 'Soma dos valores de vIBSUFRT dos itens não confere com o total em IBSCBSTot',
                        correcao: 'Ajustar o valor vIBSUF em IBSCBSTot/gIBS/gIBSUF para corresponder à soma dos itens',
                        orientacao: 'Verificar os valores de vIBSUFRT em cada item e o total declarado em IBSCBSTot',
                        campos: ['vIBSUF (IBSCBSTot)']
                    });
                }
                
                if (Math.abs(total_vIBSMunRT - vIBSMun_ibscbs_tot) > 0.01) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'Total IBSMun divergente',
                        desc: `Total do IBSMun nos itens (vIBSMunRT): R$ ${total_vIBSMunRT.toFixed(2)} vs Total declarado em IBSCBSTot/gIBS/gIBSMun/vIBSMun: R$ ${vIBSMun_ibscbs_tot.toFixed(2)}`,
                        motivo: 'Soma dos valores de vIBSMunRT dos itens não confere com o total em IBSCBSTot',
                        correcao: 'Ajustar o valor vIBSMun em IBSCBSTot/gIBS/gIBSMun para corresponder à soma dos itens',
                        orientacao: 'Verificar os valores de vIBSMunRT em cada item e o total declarado em IBSCBSTot',
                        campos: ['vIBSMun (IBSCBSTot)']
                    });
                }
            } else {
                // Verificar se há itens com Reforma Tributária para informar ausência de IBSCBSTot
                const temReformaTributaria = dados.itens.some(item => item.temGIBSCBS);
                if (temReformaTributaria) {
                    mensagens.push({
                        tipo: 'warning',
                        erro: 'Grupo IBSCBSTot ausente',
                        desc: 'Foram encontrados itens com dados de Reforma Tributária (gIBSCBS), mas o grupo IBSCBSTot não foi encontrado no total do documento',
                        motivo: 'IBSCBSTot é obrigatório quando há itens com Reforma Tributária',
                        correcao: 'Adicionar o grupo IBSCBSTot no total do documento com os valores corretos',
                        orientacao: 'Verificar a estrutura do XML e adicionar o grupo IBSCBSTot dentro do <total>',
                        campos: ['IBSCBSTot']
                    });
                }
            }
            
            // Comparar com ISSQNtot (se houver itens com ISSQN)
            const vPIS_issqn_tot = parseFloat(dados.totals.issqntot.vPIS) || 0;
            const vCOFINS_issqn_tot = parseFloat(dados.totals.issqntot.vCOFINS) || 0;
            
            if (total_pis_issqn > 0 || vPIS_issqn_tot > 0) {
                if (Math.abs(total_pis_issqn - vPIS_issqn_tot) > 0.01) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'Total PIS divergente (ISSQN)',
                        desc: `Total do PIS nos itens (ISSQN): R$ ${total_pis_issqn.toFixed(2)} vs Total declarado em ISSQNtot: R$ ${vPIS_issqn_tot.toFixed(2)}`,
                        motivo: 'Soma dos valores de PIS dos itens com ISSQN não confere com o total em ISSQNtot',
                        correcao: 'Ajustar o valor vPIS em ISSQNtot para corresponder à soma dos itens',
                        orientacao: 'Verificar os valores de PIS em cada item e o total declarado',
                        rejeicao: '602',
                        campos: ['vPIS (ISSQNtot)']
                    });
                }
            }
            
            if (total_cofins_issqn > 0 || vCOFINS_issqn_tot > 0) {
                if (Math.abs(total_cofins_issqn - vCOFINS_issqn_tot) > 0.01) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'Total COFINS divergente (ISSQN)',
                        desc: `Total do COFINS nos itens (ISSQN): R$ ${total_cofins_issqn.toFixed(2)} vs Total declarado em ISSQNtot: R$ ${vCOFINS_issqn_tot.toFixed(2)}`,
                        motivo: 'Soma dos valores de COFINS dos itens com ISSQN não confere com o total em ISSQNtot',
                        correcao: 'Ajustar o valor vCOFINS em ISSQNtot para corresponder à soma dos itens',
                        orientacao: 'Verificar os valores de COFINS em cada item e o total declarado',
                        rejeicao: '603',
                        campos: ['vCOFINS (ISSQNtot)']
                    });
                }
            }
            
            return mensagens;
        }
        
        async function processarDados(dados) {
            const itensProcessadosPromessas = dados.itens.map(async item => ({
                ...item, validacao: await validarItem(item, dados.ide.cUF, dados.infAdic, dados.ide.mod, dados.emit.CRT)
            }));
            const itensProcessados = await Promise.all(itensProcessadosPromessas);
            const totaisValidacao = validarTotaisPISCOFINS(dados);
            const novasValidacoes = await executarNovasValidacoes(xmlDoc, NS_NFE, dados);
            
            // Para cada item com erro, obter sugestão localmente
            for (const item of itensProcessados) {
                // Processar mensagens de erro/aviso
                for (const msg of item.validacao.mensagens) {
                    if (msg.tipo !== 'success') {
                        msg.solucaoContabil = obterSugestaoContabil(
                            msg.erro || '',
                            item.cProd,
                            item.xProd
                        );
                    }
                }
                // Processar alertas específicos
                for (const alerta of item.validacao.alertas || []) {
                    alerta.solucaoContabil = obterSugestaoContabil(
                        alerta.erro || '',
                        item.cProd,
                        item.xProd
                    );
                }
            }
            
            // Para cada erro total (PIS/COFINS), também adicionar sugestão
            for (const msg of totaisValidacao) {
                msg.solucaoContabil = obterSugestaoContabil(
                    msg.erro || '',
                    'N/A',
                    'N/A'
                );
            }
            
            // Para cada erro das novas validações, também adicionar sugestão
            for (const erro of novasValidacoes) {
                // Criar uma estrutura similar para compatibilidade
                erro.solucaoContabil = obterSugestaoContabil(
                    erro.erro || '',
                    erro.item?.cProd || 'N/A',
                    erro.item?.xProd || 'N/A'
                );
            }
            
            let totalItens = itensProcessados.length;
            let ok = 0, aviso = 0, erro = 0;
            let totalCBenef = itensProcessados.filter(i => i.cBenef && i.cBenef.trim() !== '' && i.cBenef.trim() !== 'SEM CBENEF').length;
            let totalCSOSN = itensProcessados.filter(i => i.CSOSN).length;
            let totalCST = itensProcessados.filter(i => i.CST).length;
            itensProcessados.forEach(i => {
                if (i.validacao.status === 'success') ok++;
                else if (i.validacao.status === 'warning') aviso++;
                else erro++;
            });
            if (totaisValidacao.length > 0) erro++;
            if (novasValidacoes.length > 0) erro += novasValidacoes.length;
            return {
                ...dados,
                itensProcessados,
                totaisValidacao,
                novasValidacoes,
                stats: { totalItens, ok, aviso, erro, totalCBenef, totalCSOSN, totalCST }
            };
        }

                            <tbody>
                                ${dadosProcessados.itensProcessados.map(item => {
                                    const s = item.validacao.status;
                                    const classe = s === 'success' ? '' : s === 'warning' ? 'item-aviso' : 'item-erro';
                                    const badge = s === 'success' ? '<span class="badge badge-success">OK ✅</span>' : 
                                                  s === 'warning' ? '<span class="badge badge-warning">AVISO ⚠️</span>' : 
                                                  '<span class="badge badge-error">ERRO ❌</span>';
                                    return `<tr class="${classe}">
                                        <td>${item.nItem}</td>
                                        <td>${item.xProd}</td>
                                        ${temErroCST ? `<td>${item.CST || '-'}</td>` : ''}
                                        ${temErroCBenef ? `<td>${item.cBenef || '-'}</td>` : ''}
                                        ${temErroNCM ? `<td>${item.NCM || '-'}</td>` : ''}
                                        <td>${badge}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                        <h2>Diagnósticos</h2>
                        
                        <!-- Renderizar erros das novas validações (telefone, CEP, chave de acesso, etc.) -->
                        ${dadosProcessados.novasValidacoes.length > 0 ? `
                            <h3 style="margin-bottom:10px;">Erros Estruturais e Matemáticos</h3>
                            ${dadosProcessados.novasValidacoes.map(erro => `
                                <div class="diagnostico error">
                                    <h3>${erro.erro}</h3>
                                    <div class="grid">
                                        <div class="campo"><span class="campo-label">Descrição</span><span>${erro.mensagem}</span></div>
                                        ${erro.item ? `<div class="campo"><span class="campo-label">Item</span><span>${erro.item}</span></div>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        ` : ''}
                        
                        <!-- Renderizar problemas nos totais (PIS/COFINS) -->
                        ${dadosProcessados.totaisValidacao.length > 0 ? dadosProcessados.totaisValidacao.map(msg => `
                            <div class="diagnostico ${msg.tipo}">
                                <h3>Totais do Documento ${msg.rejeicao ? '(Rejeição ' + msg.rejeicao + ')' : ''}</h3>
                                <div class="grid">
                                    <div class="campo"><span class="campo-label">vPIS (ICMSTot)</span><span>${dadosProcessados.totals.icmstot.vPIS || '0'}</span></div>
                                    <div class="campo"><span class="campo-label">vCOFINS (ICMSTot)</span><span>${dadosProcessados.totals.icmstot.vCOFINS || '0'}</span></div>
                                    <div class="campo"><span class="campo-label">vPIS (ISSQNTot)</span><span>${dadosProcessados.totals.issqntot.vPIS || '0'}</span></div>
                                    <div class="campo"><span class="campo-label">vCOFINS (ISSQNTot)</span><span>${dadosProcessados.totals.issqntot.vCOFINS || '0'}</span></div>
                                </div>
                                <div style="margin-top:15px;">
                                    <div style="margin-bottom:5px;"><strong>Descrição:</strong> ${msg.desc}</div>
                                    <div style="margin-bottom:5px;"><strong>Motivo:</strong> ${msg.motivo}</div>
                                    <div style="margin-bottom:5px;"><strong>Como Corrigir:</strong> ${msg.correcao}</div>
                                </div>
                            </div>
                        `).join('') : ''}
                        
                        <!-- Renderizar problemas dos itens -->
                        ${dadosProcessados.itensProcessados.flatMap(item => {
                            return item.validacao.mensagens.filter(m => m.tipo !== 'success').map(msg => `
                                <div class="diagnostico ${msg.tipo}">
                                    <h3>Item ${item.nItem}: ${item.xProd} (${msg.erro})</h3>
                                    <div class="grid">
                                        <div class="campo"><span class="campo-label">Descrição</span><span>${msg.desc}</span></div>
                                        <div class="campo"><span class="campo-label">Motivo</span><span>${msg.motivo}</span></div>
                                        <div class="campo"><span class="campo-label">Como Corrigir</span><span>${msg.correcao}</span></div>
                                        <div class="campo"><span class="campo-label">Rejeição</span><span>${msg.rejeicao || '-'}</span></div>
                                    </div>
                                </div>
                            `);
                        }).join('')}
                        
                        ${!temProblemas ? 
                            '<div style="text-align:center;padding:40px;background:#d1fae5;color:#059669;border-radius:8px;font-weight:700;font-size:1.1rem;">✅ Nenhum problema encontrado!</div>' : ''}
                    </div>
                </body>
                </html>
            `;
            const blob = new Blob([html], {type:'text/html'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `relatorio-nfe-nota-${dadosProcessados.ide.nNF}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }
        // ==========================================
        // EVENTOS DA INTERFACE
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const ua = document.getElementById('upload-area');
            const fi = document.getElementById('file-input');
            const pasteArea = document.getElementById('paste-area');
            const btnAnalisarPaste = document.getElementById('btn-analisar-paste');
            const btnTabArquivo = document.getElementById('btn-tab-arquivo');
            const btnTabConteudo = document.getElementById('btn-tab-conteudo');
            const sectionArquivo = document.getElementById('section-arquivo');
            const sectionConteudo = document.getElementById('section-conteudo');
            const btnLimpar = document.getElementById('btn-limpar');
            
            // Toggle between tabs
            const switchToArquivo = () => {
                sectionArquivo.style.display = 'block';
                sectionConteudo.style.display = 'none';
                btnTabArquivo.style.background = 'var(--primary)';
                btnTabArquivo.style.color = 'white';
                btnTabConteudo.style.background = 'var(--border)';
                btnTabConteudo.style.color = 'var(--text)';
            };
            const switchToConteudo = () => {
                sectionArquivo.style.display = 'none';
                sectionConteudo.style.display = 'block';
                btnTabConteudo.style.background = 'var(--primary)';
                btnTabConteudo.style.color = 'white';
                btnTabArquivo.style.background = 'var(--border)';
                btnTabArquivo.style.color = 'var(--text)';
            };
            btnTabArquivo.addEventListener('click', switchToArquivo);
            btnTabConteudo.addEventListener('click', switchToConteudo);
            
            // Nova Análise button - reset UI
            btnLimpar.addEventListener('click', () => {
                // Show upload container, hide results and button
                document.getElementById('upload-container').style.display = 'block';
                document.getElementById('results').style.display = 'none';
                document.getElementById('btn-limpar').style.display = 'none';
                
                // Reset fields
                document.getElementById('file-input').value = '';
                document.getElementById('paste-area').value = '';
                
                // Switch back to Arquivo tab
                switchToArquivo();
                
                // Reset data
                dadosProcessados = null;
                xmlDoc = null;
                xmlConteudoAtual = '';
                logsDebug = [];
            });
            
            // Make upload area focusable
            ua.setAttribute('tabindex', '0');
            ua.style.outline = 'none';
            
            // Drag/drop
            ua.addEventListener('dragover', e => {
                e.preventDefault();
                ua.classList.add('dragover');
            });
            ua.addEventListener('dragleave', e => {
                e.preventDefault();
                ua.classList.remove('dragover');
            });
            ua.addEventListener('drop', async e => {
                e.preventDefault();
                ua.classList.remove('dragover');
                const arquivo = e.dataTransfer.files[0];
                if (arquivo && arquivo.name.endsWith('.xml')) {
                    await processarInput(arquivo);
                } else {
                    alert('Por favor, selecione um arquivo XML válido!');
                }
            });
            ua.addEventListener('click', e => {
                if (e.target.tagName !== 'BUTTON') fi.click();
            });
            fi.addEventListener('change', async e => {
                const arquivo = e.target.files[0];
                if (arquivo) await processarInput(arquivo);
            });

            // Paste area button
            const processarTextarea = async () => {
                const text = pasteArea.value;
                if (text && text.trim().startsWith('<')) {
                    await processarInput(text);
                } else {
                    alert('Por favor, cole um XML válido!');
                }
            };
            btnAnalisarPaste.addEventListener('click', processarTextarea);
            pasteArea.addEventListener('keydown', async (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    await processarTextarea();
                }
            });
        });
        async function processarInput(input) {
            showLoading();
            setLoadingText('🔍 Analisando XML...');
            try {
                analiseIAEmAndamento = false;
                const dados = await lerXML(input);
                
                if (dados.tipo === 'inutNFe') {
                    // Renderiza dados de inutilização
                    renderizarInutNFe(dados.dados);
                } else {
                    // Renderiza NF-e normal
                    dadosProcessados = await processarDados(dados);
                    dadosProcessados.analiseIA = null;
                    renderizarTudo();
                }
                
                // Hide upload container, show Nova Análise button, show results
                document.getElementById('upload-container').style.display = 'none';
                document.getElementById('results').style.display = 'block';
                document.getElementById('btn-limpar').style.display = 'block';
            } catch (erro) {
                alert(`Erro ❌: ${erro.message}`);
            } finally {
                setLoadingText('🔍Analisando XML...');
                hideLoading();
            }
        }
        
        function renderizarInutNFe(dados) {
            const di = document.getElementById('doc-info');
            const d = document.getElementById('diagnostics');
            const previewDiv = document.getElementById('relatorio-preview');
            const aiCard = document.getElementById('ai-analysis-card');
            const aiActionCard = document.getElementById('ai-action-card');
            const btnIA = document.getElementById('btn-analise-ia');
            const uf = dados.cUF === '35' ? 'SP' : dados.cUF || '';
            dadosProcessados = null;
            if (aiCard) aiCard.style.display = 'none';
            if (aiActionCard) aiActionCard.style.display = 'none';
            if (btnIA) {
                btnIA.disabled = true;
                btnIA.textContent = '🧠 Explicar com IA';
            }
            
            // Renderiza info básica
            di.innerHTML = `
                <div class="diagnostic-field">
                    <span class="diagnostic-field-label">Tipo de Documento</span>
                    <span class="diagnostic-field-value">${dados.tipo}</span>
                </div>
                <div class="diagnostic-field">
                    <span class="diagnostic-field-label">UF</span>
                    <span class="diagnostic-field-value">${uf}</span>
                </div>
                <div class="diagnostic-field">
                    <span class="diagnostic-field-label">Ano</span>
                    <span class="diagnostic-field-value">${dados.ano}</span>
                </div>
                <div class="diagnostic-field">
                    <span class="diagnostic-field-label">CNPJ</span>
                    <span class="diagnostic-field-value">${dados.CNPJ}</span>
                </div>
                <div class="diagnostic-field">
                    <span class="diagnostic-field-label">Modelo</span>
                    <span class="diagnostic-field-value">${dados.modelo}</span>
                </div>
                <div class="diagnostic-field">
                    <span class="diagnostic-field-label">Série</span>
                    <span class="diagnostic-field-value">${dados.serie}</span>
                </div>
                <div class="diagnostic-field">
                    <span class="diagnostic-field-label">Número Inicial</span>
                    <span class="diagnostic-field-value">${dados.nNFIni}</span>
                </div>
                <div class="diagnostic-field">
                    <span class="diagnostic-field-label">Número Final</span>
                    <span class="diagnostic-field-value">${dados.nNFFin}</span>
                </div>
            `;
            
            // Renderiza justificativa
            d.innerHTML = `
                <div class="diagnostic-item success">
                    <div class="diagnostic-header">
                        <div class="diagnostic-title">
                            Justificativa
                        </div>
                    </div>
                    <div style="margin-top: 16px;">
                        <p style="padding: 12px; background: var(--bg); border-left:4px solid var(--success); border-radius:0 var(--radius) var(--radius) 0;">
                            ${dados.xJust}
                        </p>
                    </div>
                </div>
                <div style="text-align:center;padding:60px;">
                    <div style="font-size:4rem;">📄</div>
                    <div style="margin-top:20px;color:var(--text-secondary);font-weight:700;font-size:1.25rem;">
                        Arquivo de inutilização de NF-e carregado com sucesso!
                    </div>
                </div>
            `;
            
            // Oculta a pré-visualização do relatório para inutilização
            previewDiv.innerHTML = '';
            previewDiv.parentElement.style.display = 'none';
            
            document.getElementById('results').style.display = 'block';
            // Não habilita o botão para inutilização, pois não há relatório para exportar
            document.getElementById('btn-baixar-relatorio').disabled = true;
        }
    </script>
</body>
</html>
