                    vIBSUFRT = getTextoElemento(gIBSUF, 'vIBSUF') || '';
                    pRedIBSUFRT = getTextoElemento(gIBSUF, 'pRedIBSUF') || '';
                    pDifIBSUFRT = getTextoElemento(gIBSUF, 'pDifIBSUF') || '';
                    pEfetIBSUFRT = getTextoElemento(gIBSUF, 'pEfetIBSUF') || '';
                }

                // Read gIBSMun
                if (gIBSMun) {
                    pIBSMunRT = getTextoElemento(gIBSMun, 'pIBSMun') || '';
                    vIBSMunRT = getTextoElemento(gIBSMun, 'vIBSMun') || '';
                    pRedIBSMunRT = getTextoElemento(gIBSMun, 'pRedIBSMun') || '';
                    pDifIBSMunRT = getTextoElemento(gIBSMun, 'pDifIBSMun') || '';
                    pEfetIBSMunRT = getTextoElemento(gIBSMun, 'pEfetIBSMun') || '';
                }

                // Read gIS
                if (gIS) {
                    pISRT = getTextoElemento(gIS, 'pIS') || '';
                    vISRT = getTextoElemento(gIS, 'vIS') || '';
                }

                // Read gDevTrib
                if (gDevTrib) {
                    pDevTribRT = getTextoElemento(gDevTrib, 'pDevTrib') || '';
                }
            }

            // Ler PIS e COFINS (incluindo PISOutr e COFINSOutr)
            if (imposto) {
                const pisContainer = getElemento(imposto, 'PIS');
                if (pisContainer) {
                    const pisTags = ['PISAliq', 'PISQtde', 'PISNT', 'PISOutr'];
                    for (let tag of pisTags) {
                        let elem = getElemento(pisContainer, tag);
                        if (elem) {
                            vPIS = getTextoElemento(elem, 'vPIS') || '0';
                            CST_PIS = getTextoElemento(elem, 'CST') || '';
                            pPIS = getTextoElemento(elem, 'pPIS') || '';
                            vBCPIS = getTextoElemento(elem, 'vBC') || '';
                            log(`Item ${nItem}: Encontrado <${tag}> - vPIS: "${vPIS}", CST: "${CST_PIS}"`);
                            break;
                        }
                    }
                }
                
                const cofinsContainer = getElemento(imposto, 'COFINS');
                if (cofinsContainer) {
                    const cofinsTags = ['COFINSAliq', 'COFINSQtde', 'COFINSNT', 'COFINSOutr'];
                    for (let tag of cofinsTags) {
                        let elem = getElemento(cofinsContainer, tag);
                        if (elem) {
                            vCOFINS = getTextoElemento(elem, 'vCOFINS') || '0';
                            CST_COFINS = getTextoElemento(elem, 'CST') || '';
                            pCOFINS = getTextoElemento(elem, 'pCOFINS') || '';
                            vBCCOFINS = getTextoElemento(elem, 'vBC') || '';
                            log(`Item ${nItem}: Encontrado <${tag}> - vCOFINS: "${vCOFINS}", CST: "${CST_COFINS}"`);
                            break;
                        }
                    }
                }
            }
            
            // Guardar o elemento XML para extrair o trecho depois
            const xmlTrecho = imposto ? new XMLSerializer().serializeToString(imposto) : '';
            
            return { 
                nItem, xProd, cProd, NCM, CFOP, cBenef, cClassTrib, CST, CSOSN, pRedBC, 
                vPIS, CST_PIS, pPIS, vBCPIS, vCOFINS, CST_COFINS, pCOFINS, vBCCOFINS,
                temICMS, vBCICMS, pICMS, vICMS, temISSQN, xmlTrecho,
                vUnCom, vProd, vDesc, vFrete, vSeg, vOutro, vDedISSQN, pDedISSQN, xMotDedISSQN,
                temIBS, cstIBS, vBCIBS, pIBS, vIBS, pRedBCIBS, vRedBCIBS, motRedIBS, cBenefIBS,
                temCBS, cstCBS, vBCCBS, pCBS, vCBS, pRedBCCBS, vRedBCCBS, motRedCBS, cBenefCBS,
                temIS, cstIS, vBCIS, pIS, vIS, qBCIS, vAliqProd,
                temGIBSCBS, indIncIBSCBS, cstRT, vBCIBSCBS,
                pCBSRT, vCBSRT, pRedCBSRT, pDifCBSRT, pEfetCBSRT, pCredPresCBSRT, vCredPresCBSRT,
                pIBSUFRT, vIBSUFRT, pRedIBSUFRT, pDifIBSUFRT, pEfetIBSUFRT,
                pIBSMunRT, vIBSMunRT, pRedIBSMunRT, pDifIBSMunRT, pEfetIBSMunRT,
                pISRT, vISRT, pDevTribRT
            };
        }
        // ==========================================
        // VALIDAÇÃO DAS REGRAS
        // ==========================================
        async function validarItem(item, cUF, infAdic, modelo, CRT, validarReforma = false) {
            log(`Iniciando validação do item ${item.nItem} (${item.xProd}) - validarReforma=${validarReforma}`);
            log(`Dados do item: ${JSON.stringify(item)}`);
            const mensagens = [];
            const alertas = [];
            let status = 'success';
            let regra = null;

            // Identificador visual do item para ser anexado às mensagens
            const idItem = `[Item ${item.nItem} - ${item.xProd} (Cód: ${item.cProd})]`;

            // Mapeamento de cUF para sigla
            const siglasUF = {
                '11':'RO','12':'AC','13':'AM','14':'RR','15':'PA','16':'AP','17':'TO',
                '21':'MA','22':'PI','23':'CE','24':'RN','25':'PB','26':'PE','27':'AL',
                '28':'SE','29':'BA','31':'MG','32':'ES','33':'RJ','35':'SP','41':'PR',
                '42':'SC','43':'RS','50':'MS','51':'MT','52':'GO','53':'DF'
            };
            const siglaUF = siglasUF[cUF] || '';
            const cBenef = item.cBenef ? item.cBenef.trim() : '';

            // Valida NCM
            if (item.NCM) {
                const resultadoNCM = await validarNCM(item.NCM);
                if (!resultadoNCM.valido) {
                    status = 'warning';
                    const nomeErro = resultadoNCM.tipo === 'inexistente' ? '<strong>NCM pode ser Inválido</strong>' : 'ERRO_NCM_TAMANHO';
                    const mensagemNCM = resultadoNCM.tipo === 'inexistente'
                        ? `NCM ${item.NCM} é inválido ou não existe na base oficial.`
                        : `NCM ${item.NCM} inválido ou desatualizado.`;
                    mensagens.push({
                        tipo: 'warning',
                        erro: nomeErro,
                        desc: `${idItem} ${mensagemNCM}`,
                        motivo: resultadoNCM.tipo === 'inexistente' ? 'Código NCM não encontrado na base oficial' : 'Código NCM inválido ou desatualizado',
                        correcao: 'Consultar a contabilidade da loja ou a lista oficial de NCMs',
                        orientacao: obterSugestaoContabil(nomeErro, item.cProd, item.xProd),
                        rejeicao: '',
                        campos: ['NCM']
                    });
                }
            }

            // Valida regras CRT
            const regrasCRT = validarRegrasCRT(item, CRT, cUF);
            if (regrasCRT.length > 0) {
                // Formata as mensagens de CRT para incluírem o identificador do item
                regrasCRT.forEach(r => {
                    r.desc = `${idItem} ${r.desc}`;
                    r.orientacao = obterSugestaoContabil(r.erro, item.cProd, item.xProd);
                });
                mensagens.push(...regrasCRT);
                status = 'error';
            }

            // Se tem CSOSN (Simples Nacional)
            if (item.CSOSN) {
                log(`Item ${item.nItem}: CSOSN ${item.CSOSN} (Simples Nacional)`);
            } else if (!item.CST) {
                status = 'error';
                mensagens.push({
                    tipo: 'error',
                    erro: 'CST não encontrado',
                    desc: `${idItem} Item sem Código de Situação Tributária (CST).`,
                    motivo: 'Cadastro tributário incompleto',
                    correcao: 'Verificar o cadastro do produto e o CST no ERP',
                    orientacao: obterSugestaoContabil('CST não encontrado', item.cProd, item.xProd),
                    rejeicao: '',
                    campos: ['CST']
                });
                return { status, mensagens, alertas, regra };
            }

            // Validações específicas de CST
            if (item.CST) {
                const cstNormalizado = item.CST.padStart(2, '0');
                regra = CST_REGRAS[cstNormalizado];

                if (!regra) {
                    status = 'warning';
                    mensagens.push({
                        tipo: 'warning',
                        erro: 'CST desconhecido',
                        desc: `${idItem} CST ${cstNormalizado} não está na lista padrão.`,
                        motivo: 'CST não reconhecido',
                        correcao: 'Verificar se o CST é válido para a operação',
                        orientacao: obterSugestaoContabil('CST desconhecido', item.cProd, item.xProd),
                        rejeicao: '',
                        campos: ['CST']
                    });
                    return { status, mensagens, alertas, regra };
                }

                log(`Item ${item.nItem}: CST ${cstNormalizado} (${regra.desc}) - cBenef: "${cBenef}"`);

                // Bloqueio de "SEM CBENEF"
                if (cBenef === 'SEM CBENEF') {
                    status = 'error';
                    mensagens.push({
                        tipo: 'error',
                        erro: 'cBenef descontinuado',
                        desc: `${idItem} O código "SEM CBENEF" foi descontinuado em 01/07/2026.`,
                        motivo: 'Código de benefício obsoleto',
                        correcao: 'Remover o cBenef ou utilizar um código válido',
                        orientacao: obterSugestaoContabil('cBenef descontinuado', item.cProd, item.xProd),
                        rejeicao: '',
                        campos: ['cBenef']
                    });
                }

                // Validação SP + CST 90
                const isSP = cUF === '35';
                const isCST90 = cstNormalizado === '90';
                const isCFOPAlimentacao = ['5102', '5101', '5103', '5104', '5115', '5910'].includes(item.CFOP);
                const cBenefValidosCST90 = CST_REGRAS['90'].cBenefValidos || [];

                if (isSP && isCST90) {
                    if (isCFOPAlimentacao) {
                        if (cBenef !== 'SP040100') {
                            status = 'error';
                            mensagens.push({
                                tipo: 'error',
                                erro: 'cBenef obrigatório',
                                desc: `${idItem} CST 90 com CFOP ${item.CFOP} (alimentação) em SP exige cBenef SP040100.`,
                                motivo: 'Regime especial de tributação para fornecimento de alimentação em SP',
                                correcao: 'Informe o cBenef SP040100 no cadastro do produto',
                                orientacao: obterSugestaoContabil('cBenef obrigatório', item.cProd, item.xProd),
                                rejeicao: '928',
                                campos: ['cBenef']
                            });
                        }
                    } else {
                        if (cBenef && cBenef !== 'SEM CBENEF') {
                            if (!cBenefValidosCST90.includes(cBenef)) {
                                alertas.push({
                                    tipo: 'warning',
                                    erro: 'ALERTA CBENEF',
                                    desc: `${idItem} Código de benefício informado é inválido para este CST.`,
                                    motivo: 'Código cBenef não existe na tabela oficial da SEFAZ',
                                    correcao: 'Remover o cBenef do cadastro do produto',
                                    orientacao: obterSugestaoContabil('ALERTA CBENEF', item.cProd, item.xProd),
                                    campos: ['cBenef']
                                });
                            } else {
                                if (cBenef === 'SP099090') {
                                    const textoComplementar = `${infAdic.infAdFisco} ${infAdic.infCpl}`.trim();
                                    if (!textoComplementar) {
                                        status = 'error';
                                        mensagens.push({
                                            tipo: 'error',
                                            erro: 'Processo judicial não informado',
                                            desc: `${idItem} O cBenef SP099090 exige o número do processo judicial nas informações complementares.`,
                                            motivo: 'Faltou informar o processo judicial',
                                            correcao: 'Incluir o número do processo judicial em infAdFisco ou infCpl',
                                            orientacao: obterSugestaoContabil('Processo judicial não informado', item.cProd, item.xProd),
                                            rejeicao: '',
                                            campos: ['infAdFisco', 'infCpl']
                                        });
                                    }
                                } else if (cBenef === 'SP099999') {
                                    const textoComplementar = infAdic.infCpl.trim();
                                    if (!textoComplementar) {
                                        status = 'error';
                                        mensagens.push({
                                            tipo: 'error',
                                            erro: 'Fundamentação legal não informada',
                                            desc: `${idItem} O cBenef SP099999 exige fundamentação legal nas informações complementares.`,
                                            motivo: 'Faltou informar a fundamentação legal',
                                            correcao: 'Incluir a fundamentação legal em infCpl',
                                            orientacao: obterSugestaoContabil('Fundamentação legal não informada', item.cProd, item.xProd),
                                            rejeicao: '',
                                            campos: ['infCpl']
                                        });
                                    }
                                }
                            }
                        }
                    }
                } else if (['40', '41'].includes(cstNormalizado) && cBenef === 'SP019090') {
                    log(`Item ${item.nItem}: CST ${cstNormalizado} com cBenef SP019090 permitido`);
                } else {
                    const cBenefValidosGlobais = Object.keys(CBENEF_REGRAS);
                    const cBenefValidosItem = regra.cBenefValidos || [];
                    const cBenefValidosTodos = [...new Set([...cBenefValidosGlobais, ...cBenefValidosItem, 'SEMOBRIGATORIEDADE'])];
                    const cstsDesobrigados = ['00', '02', '10', '15', '60', '61'];
                    const exigeCBenef = regra.aceitaCBenef === true && !cstsDesobrigados.includes(cstNormalizado);

                    if (exigeCBenef) {
                        const cBenefValido = cBenef && cBenef !== 'SEM CBENEF' && cBenefValidosTodos.includes(cBenef);
                        if (!cBenefValido) {
                            status = 'error';
                            mensagens.push({
                                tipo: 'error',
                                erro: 'REJEICAO_928',
                                desc: `${idItem} CST ${cstNormalizado} (${regra.desc}) exige cBenef válido.`,
                                motivo: 'Faltou informar código de benefício fiscal ou código inválido',
                                correcao: 'Informe o cBenef válido para este CST',
                                orientacao: obterSugestaoContabil('REJEICAO_928', item.cProd, item.xProd),
                                rejeicao: '928',
                                campos: ['cBenef']
                            });
                        } else {
                            if (cBenef === 'SP099090') {
                                if (!CBENEF_REGRAS['SP099090'].cstsValidos.includes(cstNormalizado)) {
                                    status = 'error';
                                    mensagens.push({
                                        tipo: 'error',
                                        erro: 'cBenef não permitido para este CST',
                                        desc: `${idItem} O cBenef SP099090 não é permitido para CST ${cstNormalizado}.`,
                                        motivo: 'Código de benefício não compatível com o CST',
                                        correcao: 'Alterar o cBenef para um código válido para este CST',
                                        orientacao: obterSugestaoContabil('cBenef não permitido para este CST', item.cProd, item.xProd),
                                        rejeicao: '',
                                        campos: ['CST', 'cBenef']
                                    });
                                } else {
                                    const textoComplementar = `${infAdic.infAdFisco} ${infAdic.infCpl}`.trim();
                                    if (!textoComplementar) {
                                        status = 'error';
                                        mensagens.push({
                                            tipo: 'error',
                                            erro: 'Processo judicial não informado',
                                            desc: `${idItem} O cBenef SP099090 exige o número do processo judicial nas informações complementares.`,
                                            motivo: 'Faltou informar o processo judicial',
                                            correcao: 'Incluir o número do processo judicial em infAdFisco ou infCpl',
                                            orientacao: obterSugestaoContabil('Processo judicial não informado', item.cProd, item.xProd),
                                            rejeicao: '',
                                            campos: ['infAdFisco', 'infCpl']
                                        });
                                    }
                                }
                            } else if (cBenef === 'SP099000') {
                                if (cstNormalizado !== '90') {
                                    status = 'error';
                                    mensagens.push({
                                        tipo: 'error',
                                        erro: 'cBenef não permitido para este CST',
                                        desc: `${idItem} O cBenef SP099000 só é permitido para CST 90.`,
                                        motivo: 'Código de benefício não compatível com o CST',
                                        correcao: 'Alterar o cBenef para um código válido para este CST',
                                        orientacao: obterSugestaoContabil('cBenef não permitido para este CST', item.cProd, item.xProd),
                                        rejeicao: '',
                                        campos: ['CST', 'cBenef']
                                    });
                                }
                            } else if (cBenef === 'SP099009') {
                                if (!CBENEF_REGRAS['SP099009'].cstsValidos.includes(cstNormalizado)) {
                                    status = 'error';
                                    mensagens.push({
                                        tipo: 'error',
                                        erro: 'cBenef não permitido para este CST',
                                        desc: `${idItem} O cBenef SP099009 não é permitido para CST ${cstNormalizado}.`,
                                        motivo: 'Código de benefício não compatível com o CST',
                                        correcao: 'Alterar o cBenef para um código válido para este CST',
                                        orientacao: obterSugestaoContabil('cBenef não permitido para este CST', item.cProd, item.xProd),
                                        rejeicao: '',
                                        campos: ['CST', 'cBenef']
                                    });
                                }
                            } else if (cBenef === 'SP099999') {
                                if (!CBENEF_REGRAS['SP099999'].cstsValidos.includes(cstNormalizado)) {
                                    status = 'error';
                                    mensagens.push({
                                        tipo: 'error',
                                        erro: 'cBenef não permitido para este CST',
                                        desc: `${idItem} O cBenef SP099999 só é permitido para CST 40 e 90.`,
                                        motivo: 'Código de benefício não compatível com o CST',
                                        correcao: 'Alterar o cBenef para um código válido para este CST',
                                        orientacao: obterSugestaoContabil('cBenef não permitido para este CST', item.cProd, item.xProd),
                                        rejeicao: '',
                                        campos: ['CST', 'cBenef']
                                    });
                                } else {
                                    const textoComplementar = infAdic.infCpl.trim();
                                    if (!textoComplementar) {
                                        status = 'error';
                                        mensagens.push({
                                            tipo: 'error',
                                            erro: 'Fundamentação legal não informada',
                                            desc: `${idItem} O cBenef SP099999 exige fundamentação legal nas informações complementares.`,
                                            motivo: 'Faltou informar a fundamentação legal',
                                            correcao: 'Incluir a fundamentação legal em infCpl',
                                            orientacao: obterSugestaoContabil('Fundamentação legal não informada', item.cProd, item.xProd),
                                            rejeicao: '',
                                            campos: ['infCpl']
                                        });
                                    }
                                }
                            } else if (cBenef === 'SP020390') {
                                if (!CBENEF_REGRAS['SP020390'].cstsValidos.includes(cstNormalizado)) {
                                    status = 'error';
                                    mensagens.push({
                                        tipo: 'error',
                                        erro: 'cBenef não permitido para este CST',
                                        desc: `${idItem} O cBenef SP020390 só é permitido para CST 20 e 70.`,
                                        motivo: 'Código de benefício não compatível com o CST',
                                        correcao: 'Alterar o cBenef para um código válido para este CST',
                                        orientacao: obterSugestaoContabil('cBenef não permitido para este CST', item.cProd, item.xProd),
                                        rejeicao: '',
                                        campos: ['CST', 'cBenef']
                                    });
                                }
                            }

                            if (regra.precisaPREDBC && !item.pRedBC) {
                                status = 'error';
                                mensagens.push({
                                    tipo: 'error',
                                    erro: 'pRedBC obrigatório',
                                    desc: `${idItem} CST 20 exige percentual de redução da base de cálculo.`,
                                    motivo: 'Faltou informar o pRedBC',
                                    correcao: 'Preencher o campo % Base Red. no cadastro do produto',
                                    orientacao: obterSugestaoContabil('pRedBC obrigatório', item.cProd, item.xProd),
                                    rejeicao: '',
                                    campos: ['pRedBC']
                                });
                            }
                        }
                    } else {
                        if (cBenef && cBenef !== 'SEM CBENEF') {
                            if (cBenefValidosTodos.includes(cBenef)) {
                                log(`Item ${item.nItem}: cBenef "${cBenef}" informado em CST que não exige, mas é válido (tolerância SEFAZ)`);
                            } else {
                                alertas.push({
                                    tipo: 'warning',
                                    erro: 'ALERTA CBENEF',
                                    desc: `${idItem} Código de benefício informado inválido para este CST.`,
                                    motivo: 'Código cBenef não existe na tabela oficial da SEFAZ',
                                    correcao: 'Remover o cBenef do cadastro do produto',
                                    orientacao: obterSugestaoContabil('ALERTA CBENEF', item.cProd, item.xProd),
                                    campos: ['cBenef']
                                });
                            }
                        }
                    }
                }
            }

            // Validação das novas regras (4-8) + Reforma Tributária
            const novasMensagens = validarNovasRegras(item, validarReforma);
            if (novasMensagens.length > 0) {
                // Aplica idItem e sugestão contábil nas novas regras também
                novasMensagens.forEach(m => {
                    m.desc = `${idItem} ${m.desc}`;
                    m.orientacao = obterSugestaoContabil(m.erro, item.cProd, item.xProd);
                });
                mensagens.push(...novasMensagens);
                status = 'error';
            }

            // Validação CFOP x CST/CSOSN
            const cfopValido = validarCFOP(item, modelo, mensagens);
            if (!cfopValido) {
                status = 'error';
            }

            if (status === 'success' && mensagens.length === 0 && alertas.length === 0) {
                mensagens.push({
                    tipo: 'success',
                    erro: 'OK ✅',
                    desc: `${idItem} Item validado com sucesso!`,
                    motivo: '',
                    correcao: '',
                    orientacao: '',
                    rejeicao: '',
                    campos: []
                });
            }

            return { status, mensagens, alertas, regra };
        }

        function validarNovasRegras(item, validarReforma) {
            const mensagens = [];
            
            // REGRA 4: NCM com tamanho incorreto
            const ncmLimpo = item.NCM.replace(/\D/g, '');
            if (ncmLimpo !== '00' && ncmLimpo.length !== 8) {
                mensagens.push({
                    tipo: 'error',
                    erro: 'ERRO_NCM_TAMANHO',
                    desc: 'NCM com tamanho incorreto. Deve ter 8 dígitos.',
                    motivo: 'NCM informado não tem o tamanho padrão de 8 dígitos.',
                    correcao: 'Acesse o cadastro do produto e atualize o NCM para um valor válido com 8 dígitos.',
                    orientacao: 'Verificar a tabela de NCM correta.',
                    campos: ['NCM']
                });
            }
            
            // REGRA 5: Produto com valor zerado
            const vUnComNum = parseFloat(item.vUnCom) || 0;
            const vProdNum = parseFloat(item.vProd) || 0;
            if (vUnComNum <= 0 || vProdNum <= 0) {
                mensagens.push({
                    tipo: 'error',
                    erro: 'ERRO_VALOR_ZERADO',
                    desc: 'Valor unitário ou total do item é menor ou igual a zero.',
                    motivo: 'Item com valor zerado não é permitido.',
                    correcao: 'Acesse a tela de vendas ou o cadastro do item e informe um valor maior que zero.',
                    orientacao: 'Verificar o preço do produto.',
                    campos: ['vUnCom', 'vProd']
                });
            }
            
       
            
            // REGRA 7: Falta detalhamento de redução de ISSQN
            if (item.temISSQN && item.vDedISSQN && parseFloat(item.vDedISSQN) > 0) {
                if (!item.pDedISSQN || !item.xMotDedISSQN) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'ERRO_DETALHE_ISS',
                        desc: 'Dedução de ISS informada, mas falta percentual ou motivo.',
                        motivo: 'Faltam detalhes da redução de ISSQN.',
                        correcao: 'Acesse o cadastro de serviços e complete os campos de parametrização da redução de ISS.',
                        orientacao: 'Verificar a parametrização do ISSQN.',
                        campos: ['pDed', 'xMotDed']
                    });
                }
            }
            
            // REGRA 8: CST PIS e COFINS inválidos
            const cstsValidos = ['01', '02', '04', '06', '07', '08', '49', '99'];
            if (item.CST_PIS && !cstsValidos.includes(item.CST_PIS)) {
                mensagens.push({
                    tipo: 'warning',
                    erro: 'ERRO_CST_PIS_COFINS',
                    desc: `CST PIS ${item.CST_PIS} inválido.`,
                    motivo: 'CST PIS não está na lista de valores válidos.',
                    correcao: 'Acesse as configurações fiscais do produto e escolha um CST de PIS válido (01, 02, 04, 06, 07, 08, 49, 99).',
                    orientacao: 'Verificar o CST PIS correto.',
                    campos: ['CST_PIS']
                });
            }
            if (item.CST_COFINS && !cstsValidos.includes(item.CST_COFINS)) {
                mensagens.push({
                    tipo: 'warning',
                    erro: 'ERRO_CST_PIS_COFINS',
                    desc: `CST COFINS ${item.CST_COFINS} inválido.`,
                    motivo: 'CST COFINS não está na lista de valores válidos.',
                    correcao: 'Acesse as configurações fiscais do produto e escolha um CST de COFINS válido (01, 02, 04, 06, 07, 08, 49, 99).',
                    orientacao: 'Verificar o CST COFINS correto.',
                    campos: ['CST_COFINS']
                });
            }
            
            // VALIDAÇÃO DE PIS (Rejeição 602)
            const cstPisTributavel = ['01', '02'];
            if (item.CST_PIS && cstPisTributavel.includes(item.CST_PIS)) {
                // 1. Calcular base de cálculo esperada: vProd - vDesc + vFrete + vSeg + vOutro
                const vProdNum = parseFloat(item.vProd) || 0;
                const vDescNum = parseFloat(item.vDesc) || 0;
                const vFreteNum = parseFloat(item.vFrete) || 0;
                const vSegNum = parseFloat(item.vSeg) || 0;
                const vOutroNum = parseFloat(item.vOutro) || 0;
                
                const vBCEsperado = vProdNum - vDescNum + vFreteNum + vSegNum + vOutroNum;
                const vBCInformado = parseFloat(item.vBCPIS) || 0;
                
                // 2. Validar base de cálculo
                if (Math.abs(vBCEsperado - vBCInformado) > 0.01) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'Base de cálculo PIS divergente',
                        desc: `Base de cálculo PIS esperada: ${vBCEsperado.toFixed(2)}, informada: ${vBCInformado.toFixed(2)}`,
                        motivo: 'Base de cálculo PIS não corresponde a vProd - vDesc + vFrete + vSeg + vOutro',
                        correcao: 'Ajustar a base de cálculo do PIS no cadastro do produto',
                        orientacao: 'Verificar o cálculo da base de cálculo do PIS',
                        rejeicao: '',
                        campos: ['vBCPIS', 'vProd', 'vDesc', 'vFrete', 'vSeg', 'vOutro']
                    });
                }
                
                // 3. Calcular valor do PIS esperado
                const pPISNum = parseFloat(item.pPIS) || 0;
                const vPISEsperado = Math.round((vBCInformado * (pPISNum / 100)) * 100) / 100;
                const vPISInformado = parseFloat(item.vPIS) || 0;
                
                // 4. Validar valor do PIS
                if (Math.abs(vPISInformado - vPISEsperado) > 0.01) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'Valor do PIS divergente',
                        desc: `Valor do PIS esperado: ${vPISEsperado.toFixed(2)}, informado: ${vPISInformado.toFixed(2)}`,
                        motivo: 'Valor do PIS não corresponde a base de cálculo * alíquota',
                        correcao: 'Ajustar o valor do PIS no cadastro do produto',
                        orientacao: 'Verificar o cálculo do valor do PIS',
                        rejeicao: '',
                        campos: ['vPIS', 'vBCPIS', 'pPis']
                    });
                }
            }
            
            // Validações da Reforma Tributária (gatilho de data já aplicado dentro da função)
            const mensagensReforma = validarReformaTributaria(item, validarReforma);
            mensagens.push(...mensagensReforma);
            
            return mensagens;
        }

        function validarReformaTributaria(item, validarReforma) {
            const mensagens = [];

            // GATILHO DE VIGÊNCIA: Se data < 01/08/2026, NÃO valida nada da RT
            if (!validarReforma) {
                return mensagens;
            }

            const cstRTValidos = ['000', '010', '020', '030', '040', '041', '050', '051', '060', '070', '090',
                                  '100', '110', '190', '200', '210', '290', '300', '900'];
            const cstTributadosRT = ['000', '010', '020', '030', '040', '050', '090',
                                     '100', '110', '190', '200', '210', '290', '300', '900'];

            // Campos que indicam presença de dados da Reforma Tributária no item
            const temCamposRT = item.temGIBSCBS ||
                                (item.cstRT && item.cstRT.trim() !== '') ||
                                (item.vBCIBSCBS && item.vBCIBSCBS.trim() !== '') ||
                                (item.pCBSRT && item.pCBSRT.trim() !== '') ||
                                (item.vCBSRT && parseFloat(item.vCBSRT) > 0) ||
                                (item.pIBSUFRT && item.pIBSUFRT.trim() !== '') ||
                                (item.vIBSUFRT && parseFloat(item.vIBSUFRT) > 0) ||
                                (item.pIBSMunRT && item.pIBSMunRT.trim() !== '') ||
                                (item.vIBSMunRT && parseFloat(item.vIBSMunRT) > 0) ||
                                (item.pISRT && item.pISRT.trim() !== '') ||
                                (item.vISRT && parseFloat(item.vISRT) > 0) ||
                                (item.temIBS && item.vIBS && parseFloat(item.vIBS) > 0) ||
                                (item.temCBS && item.vCBS && parseFloat(item.vCBS) > 0) ||
                                (item.temIS && item.vIS && parseFloat(item.vIS) > 0);

            if (!temCamposRT) {
                return mensagens;
            }

            // ====== REGRA 1: CST da Reforma Tributária OBRIGATÓRIO ======
            const cst = (item.cstRT || item.cstIBS || item.cstCBS || '').trim();
            if (!cst) {
                mensagens.push({
                    tipo: 'error',
                    erro: 'RT_CST_OBRIGATORIO',
                    desc: 'Nota em vigor da Reforma Tributária (a partir de 01/08/2026). Item está sem CST de IBS/CBS (CST Reforma Tributária).',
                    motivo: 'A partir de 01/08/2026 é obrigatório informar o CST da Reforma Tributária em todos os itens.',
                    correcao: 'No cadastro do produto, preencha o campo CST da Reforma Tributária (CST RT) com um código válido de 3 dígitos.',
                    campos: ['cstRT', 'cstIBS', 'cstCBS']
                });
            } else {
                // Valida se o CST RT está na lista de códigos conhecidos
                const cstFormatado = cst.padStart(3, '0');
                if (cst.length === 3 && !cstRTValidos.includes(cstFormatado)) {
                    mensagens.push({
                        tipo: 'warning',
                        erro: 'RT_CST_DESCONHECIDO',
                        desc: `CST Reforma Tributária ${cst} não está na lista de códigos conhecidos. Validar com a contabilidade.`,
                        motivo: 'CST RT informado não está na lista de códigos padrão.',
                        correcao: 'Confirmar com a contabilidade se o CST RT informado está correto para esta operação.',
                        campos: ['cstRT']
                    });
                }
            }

            // ====== REGRA 2: Código de Classificação Tributária (cClassTrib) OBRIGATÓRIO se CST tributada ======
            const cstFormatado = cst.padStart(3, '0');
            const cstClassificavel = cst.length === 3 ? cstTributadosRT.includes(cstFormatado) : cstTributadosRT.includes(cstFormatado.substring(cstFormatado.length - 3));
            if (cstClassificavel && (!item.cClassTrib || item.cClassTrib.trim() === '')) {
                mensagens.push({
                    tipo: 'error',
                    erro: 'RT_CLASSTRIB_OBRIGATORIA',
                    desc: `CST ${cst} (operação tributada) exige preenchimento do Código de Classificação Tributária (cClassTrib).`,
                    motivo: 'Itens com CST de operação tributada devem possuir cClassTrib para correta classificação na Reforma Tributária.',
                    correcao: 'No cadastro do produto, preencha o campo Código de Classificação Tributária (cClassTrib) com o código NBS/NCM ou classificação oficial.',
                    campos: ['cClassTrib']
                });
            }

            // ====== PREPARAÇÃO: Base de cálculo efetiva com aplicação de pRedCBS ======
            const vBCBase = parseFloat(item.vBCIBSCBS || item.vBCCBS || item.vBCIBS || 0) || 0;
            const pRedCBSNum = parseFloat(item.pRedCBSRT || item.pRedBCCBS || 0) || 0;
            let vBCEfetiva = vBCBase;
            if (pRedCBSNum > 0 && pRedCBSNum < 100) {
                vBCEfetiva = vBCBase * (1 - (pRedCBSNum / 100));
            }
            vBCEfetiva = Math.round(vBCEfetiva * 100) / 100;

            const arredondar = v => Math.round((parseFloat(v) || 0) * 100) / 100;
            const TOLERANCIA = 0.02;

            // ====== REGRA 3: Cálculo da CBS ======
            const pCBS = parseFloat(item.pCBSRT || item.pCBS || 0) || 0;
            const vCBSInformado = arredondar(item.vCBSRT || item.vCBS);
            if (pCBS > 0 || vCBSInformado > 0) {
                const vCBSCalculado = arredondar((vBCBase * (pCBS / 100)));
                if (Math.abs(vCBSInformado - vCBSCalculado) > TOLERANCIA) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'RT_CBS_CALCULO_DIVERGENTE',
                        desc: `CBS divergente: informado R$ ${vCBSInformado.toFixed(2)} ≠ calculado R$ ${vCBSCalculado.toFixed(2)} (Base: ${vBCBase.toFixed(2)} × ${pCBS}%)${pRedCBSNum > 0 ? ` / Redução: ${pRedCBSNum}%` : ''}.`,
                        motivo: 'Valor do CBS não corresponde à fórmula oficial (Base × Alíquota / 100).',
                        correcao: 'Recalcule o CBS no cadastro do produto utilizando a fórmula: Base × Alíquota. Se houver redução, valide o percentual.',
                        campos: ['vBCIBSCBS', 'pCBSRT', 'pRedCBSRT', 'vCBSRT']
                    });
                }
            }

            // ====== REGRA 4: Cálculo do IBS Estadual (vIBSUF) ======
            const pIBSUF = parseFloat(item.pIBSUFRT || 0) || 0;
            const vIBSUFInformado = arredondar(item.vIBSUFRT);
            if (pIBSUF > 0 || vIBSUFInformado > 0) {
                const vIBSUFCalculado = arredondar((vBCBase * (pIBSUF / 100)));
                if (Math.abs(vIBSUFInformado - vIBSUFCalculado) > TOLERANCIA) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'RT_IBSUF_CALCULO_DIVERGENTE',
                        desc: `IBS Estadual (UF) divergente: informado R$ ${vIBSUFInformado.toFixed(2)} ≠ calculado R$ ${vIBSUFCalculado.toFixed(2)} (Base: ${vBCBase.toFixed(2)} × ${pIBSUF}%).`,
                        motivo: 'Valor do IBS UF não corresponde à fórmula oficial (Base × Alíquota / 100).',
                        correcao: 'Recalcule o IBS UF no cadastro do produto utilizando a fórmula: Base × Alíquota.',
                        campos: ['vBCIBSCBS', 'pIBSUFRT', 'vIBSUFRT']
                    });
                }
            }

            // ====== REGRA 5: Cálculo do IBS Municipal (vIBSMun) ======
            const pIBSMun = parseFloat(item.pIBSMunRT || 0) || 0;
            const vIBSMunInformado = arredondar(item.vIBSMunRT);
            if (pIBSMun > 0 || vIBSMunInformado > 0) {
                const vIBSMunCalculado = arredondar((vBCBase * (pIBSMun / 100)));
                if (Math.abs(vIBSMunInformado - vIBSMunCalculado) > TOLERANCIA) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'RT_IBSMUN_CALCULO_DIVERGENTE',
                        desc: `IBS Municipal divergente: informado R$ ${vIBSMunInformado.toFixed(2)} ≠ calculado R$ ${vIBSMunCalculado.toFixed(2)} (Base: ${vBCBase.toFixed(2)} × ${pIBSMun}%).`,
                        motivo: 'Valor do IBS Município não corresponde à fórmula oficial (Base × Alíquota / 100).',
                        correcao: 'Recalcule o IBS Município no cadastro do produto utilizando a fórmula: Base × Alíquota.',
                        campos: ['vBCIBSCBS', 'pIBSMunRT', 'vIBSMunRT']
                    });
                }
            }

            // ====== REGRA 6: Cálculo do Imposto Seletivo (IS) ======
            const pIS = parseFloat(item.pISRT || item.pIS || 0) || 0;
            const vISInformado = arredondar(item.vISRT || item.vIS);
            if (pIS > 0 || vISInformado > 0) {
                const vBCISBase = arredondar(item.vBCIS || vBCBase);
                const vISCalculado = arredondar((vBCISBase * (pIS / 100)));
                if (Math.abs(vISInformado - vISCalculado) > TOLERANCIA) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'RT_IS_CALCULO_DIVERGENTE',
                        desc: `Imposto Seletivo (IS) divergente: informado R$ ${vISInformado.toFixed(2)} ≠ calculado R$ ${vISCalculado.toFixed(2)} (Base: ${vBCISBase.toFixed(2)} × ${pIS}%).`,
                        motivo: 'Valor do Imposto Seletivo não corresponde à fórmula oficial (Base × Alíquota / 100).',
                        correcao: 'Recalcule o IS no cadastro do produto utilizando a fórmula: Base × Alíquota.',
                        campos: ['vBCIS', 'pISRT', 'vISRT']
                    });
                }
            }

            // ====== Estruturas antigas (legado) - valida apenas CST se houver ======
            const cstLegadoValidos = ['00', '10', '20', '30', '40', '41', '50', '51', '60', '70', '90'];
            if (item.temIBS && item.cstIBS && item.cstIBS.length <= 2 && !cstLegadoValidos.includes(item.cstIBS.padStart(2, '0'))) {
                mensagens.push({
                    tipo: 'warning',
                    erro: 'RT_CST_IBS_LEGADO',
                    desc: `CST IBS (estrutura antiga) ${item.cstIBS} não é um código conhecido.`,
                    motivo: 'CST IBS informado em estrutura legada não está na lista oficial.',
                    correcao: 'Verificar o CST IBS correto para o produto com a contabilidade.',
                    campos: ['cstIBS']
                });
            }
            if (item.temCBS && item.cstCBS && item.cstCBS.length <= 2 && !cstLegadoValidos.includes(item.cstCBS.padStart(2, '0'))) {
                mensagens.push({
                    tipo: 'warning',
                    erro: 'RT_CST_CBS_LEGADO',
                    desc: `CST CBS (estrutura antiga) ${item.cstCBS} não é um código conhecido.`,
                    motivo: 'CST CBS informado em estrutura legada não está na lista oficial.',
                    correcao: 'Verificar o CST CBS correto para o produto com a contabilidade.',
                    campos: ['cstCBS']
                });
            }
            if (item.temIS && item.cstIS && item.cstIS.length <= 2 && !cstLegadoValidos.includes(item.cstIS.padStart(2, '0'))) {
                mensagens.push({
                    tipo: 'warning',
                    erro: 'RT_CST_IS_LEGADO',
                    desc: `CST IS (estrutura antiga) ${item.cstIS} não é um código conhecido.`,
                    motivo: 'CST IS informado em estrutura legada não está na lista oficial.',
                    correcao: 'Verificar o CST IS correto para o produto com a contabilidade.',
                    campos: ['cstIS']
                });
            }

            return mensagens;
        }

        function validarRegrasCRT(item, CRT, cUF) {
            const mensagens = [];
            const siglasUFExigemCBenef = ['35', '43', '41', '33', '53']; // SP, RS, PR, RJ, DF (cUF codes)
            const siglasUF = {
                '11':'RO','12':'AC','13':'AM','14':'RR','15':'PA','16':'AP','17':'TO',
                '21':'MA','22':'PI','23':'CE','24':'RN','25':'PB','26':'PE','27':'AL',
                '28':'SE','29':'BA','31':'MG','32':'ES','33':'RJ','35':'SP','41':'PR',
                '42':'SC','43':'RS','50':'MS','51':'MT','52':'GO','53':'DF'
            };
            const siglaUF = siglasUF[cUF] || '';

            // Regras para Simples Nacional (CRT 1 ou 2)
            if (CRT === '1' || CRT === '2') {
                // Exclusividade CSOSN: Não pode ter CST, só CSOSN
                if (item.CST && !item.CSOSN) {
                    mensagens.push({

                        orientacao: '',
                        rejeicao: '',
                        campos: ['CST', 'CSOSN']
                    });
                }

                // Cruzamento CFOP x CSOSN
                if (item.CFOP === '5102' && item.CSOSN === '500') {
                    mensagens.push({

                        desc: 'CFOP 5102 incompatível com CSOSN 500. Para CSOSN 500 use CFOP 5405.',
                        motivo: 'CFOP 5102 é para operação normal, CSOSN 500 é para ST.',
                        correcao: 'Altere o CFOP para 5405 ou o CSOSN para outro valor.',
                        orientacao: '',
                        rejeicao: '381',
                        campos: ['CFOP', 'CSOSN']
                    });
                }

                
            }

            // Regras para Regime Normal (CRT 3)
            if (CRT === '3') {
                // Exclusividade CST: Não pode ter CSOSN, só CST
                if (item.CSOSN && !item.CST) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'CSOSN_INCOMPATIVEL_REGIME_NORMAL',
                        desc: 'Uso de CSOSN em Regime Normal. Use CST.',
                        motivo: 'Regime Normal exige CST ao invés de CSOSN.',
                        correcao: 'Altere o cadastro do produto para usar CST.',
                        orientacao: '',
                        rejeicao: '600',
                        campos: ['CST', 'CSOSN']
                    });
                }

                // Cruzamento CFOP x CST
                if (item.CFOP === '5405' && item.CST !== '60') {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'CST_OBRIGATORIO_60',
                        desc: 'CFOP 5405 exige CST 60.',
                        motivo: 'CFOP 5405 é para ST, exige CST 60.',
                        correcao: 'Altere o CST para 60.',
                        orientacao: '',
                        rejeicao: '',
                        campos: ['CFOP', 'CST']
                    });
                }

                if (item.CFOP === '5102' && item.CST === '60') {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'CFOP_INCOMPATIVEL_COM_CST_60',
                        desc: 'CFOP 5102 não pode ser usado com CST 60.',
                        motivo: 'CFOP 5102 é para operação normal, CST 60 é para ST.',
                        correcao: 'Altere o CFOP ou o CST.',
                        orientacao: '',
                        rejeicao: '',
                        campos: ['CFOP', 'CST']
                    });
                }
            }

            // Regra cBenef obrigatório para certas UFs
            if (siglasUFExigemCBenef.includes(cUF)) {
                const cstsQueExigemCBenef = ['20', '40', '41', '51'];
                const csosnQueExigemCBenef = ['900']; // exemplo
                if ((cstsQueExigemCBenef.includes(item.CST) || csosnQueExigemCBenef.includes(item.CSOSN)) && !item.cBenef) {
                    mensagens.push({
                        tipo: 'error',
                        erro: 'CBENEF_OBRIGATORIO',
                        desc: `cBenef é obrigatório para este CST/CSOSN na UF ${siglaUF}.`,
                        motivo: 'UF exige cBenef para operações com isenção, redução ou diferimento.',
                        correcao: 'Informe o cBenef no cadastro do produto.',
                        orientacao: '',
                        rejeicao: '930',
                        campos: ['cBenef']
                    });
                }
            }

            return mensagens;
        }

        /**
         * Valida o dígito verificador da chave de acesso (Rejeição 252)
         * @param {string} chaveAcesso - Chave de acesso completa (44 dígitos)
         * @returns {Array} Lista de erros encontrados
         */
        function validarDVChaveAcesso(chaveAcesso) {
            const erros = [];
            if (!chaveAcesso || chaveAcesso.length !== 44) {
                erros.push({
                    erro: 'Rejeição 252',
                    mensagem: 'Chave de acesso com tamanho inválido (deve ter 44 dígitos)',
                    item: null
                });
                return erros;
            }
            
            const primeiros43 = chaveAcesso.slice(0, 43);
            const dvInformado = parseInt(chaveAcesso.charAt(43), 10);
            
            let soma = 0;
            let peso = 2;
            for (let i = primeiros43.length - 1; i >= 0; i--) {
                const digito = parseInt(primeiros43.charAt(i), 10);
                soma += digito * peso;
                peso++;
                if (peso > 9) {
                    peso = 2;
                }
            }
            
            let dvCalculado = 11 - (soma % 11);
            if (dvCalculado >= 10) {
                dvCalculado = 0;
            }
            
            if (dvCalculado !== dvInformado) {
                erros.push({
                    erro: 'Rejeição 252',
                    mensagem: `Dígito verificador da chave de acesso inválido (esperado ${dvCalculado}, informado ${dvInformado})`,
                    item: null
                });
            }
            
            return erros;
        }
        
        /**
         * Valida o dígito verificador de um código GTIN (EAN-8, EAN-13, EAN-14, UPC-A)
         * @param {string} gtin - Código GTIN
         * @returns {boolean} True se o GTIN for válido
         */
        function validarGTIN(gtin) {
            if (!gtin || typeof gtin !== 'string') return false;
            
            const gtinLimpo = gtin.trim();
            if (gtinLimpo === 'SEM GTIN') return true;
            
            if (!/^\d+$/.test(gtinLimpo)) return false;
            
            const tamanhosValidos = [8, 12, 13, 14];
            if (!tamanhosValidos.includes(gtinLimpo.length)) return false;
            
            let soma = 0;
            const reverso = gtinLimpo.split('').reverse();
            const dvInformado = parseInt(reverso[0], 10);
            
            for (let i = 1; i < reverso.length; i++) {
                const digito = parseInt(reverso[i], 10);
                if (i % 2 === 1) {
                    soma += digito * 3;
                } else {
                    soma += digito * 1;
                }
            }
            
            const resto = soma % 10;
            const dvCalculado = resto === 0 ? 0 : 10 - resto;
            return dvCalculado === dvInformado;
        }
        
        /**
         * Valida todos os códigos GTIN (cEAN e cEANTrib) dos itens (Rejeições 611 e 612)
         * @param {Document} xmlDoc - Documento XML parseado
         * @param {string} NS_NFE - Namespace da NF-e
         * @returns {Array} Lista de erros encontrados
         */
        function validarGTINsItens(xmlDoc, NS_NFE) {
            const erros = [];
            const dets = [];
            
            let nfeRoot = getElemento(xmlDoc, 'NFe');
            if (!nfeRoot) nfeRoot = getElemento(xmlDoc, 'nfeProc');
            const infNFe = nfeRoot ? getElemento(nfeRoot, 'infNFe') : null;
            
            if (!infNFe) return erros;
            
            const detsFromNS = infNFe.getElementsByTagNameNS(NS_NFE, 'det');
            if (detsFromNS.length > 0) {
                for (let i = 0; i < detsFromNS.length; i++) dets.push(detsFromNS[i]);
            } else {
                const detsFromTag = infNFe.getElementsByTagName('det');
                for (let i = 0; i < detsFromTag.length; i++) dets.push(detsFromTag[i]);
            }
            
            dets.forEach(det => {
                const nItem = det.getAttribute('nItem') || '';
                const prod = getElemento(det, 'prod');
                if (!prod) return;
                
                const cEAN = getTextoElemento(prod, 'cEAN');
                const cEANTrib = getTextoElemento(prod, 'cEANTrib');
                
                if (cEAN && cEAN.trim() !== '' && !validarGTIN(cEAN)) {
                    erros.push({
                        erro: 'Rejeição 611 (Código GTIN (cEAN))',
                        mensagem: `Código GTIN (cEAN) inválido para o item ${nItem}: ${cEAN}`,
                        item: nItem
                    });
                }
                
                if (cEANTrib && cEANTrib.trim() !== '' && !validarGTIN(cEANTrib)) {
                    erros.push({
                        erro: 'Rejeição 612 (Código GTIN tributário (cEANTrib))',
                        mensagem: `Código GTIN tributário (cEANTrib) inválido para o item ${nItem}: ${cEANTrib}`,
                        item: nItem
                    });
                }
            });
            
            return erros;
        }
        

        
        /**
         * Valida os totais de vProd e vICMS no ICMSTot (Rejeições 528 e 531)
         * @param {Document} xmlDoc - Documento XML parseado
         * @param {string} NS_NFE - Namespace da NF-e
         * @returns {Array} Lista de erros encontrados
         */
        function validarTotaisICMSProd(xmlDoc, NS_NFE) {
            const erros = [];
            let somaVProd = 0;
            let somaVICMS = 0;
            
            let nfeRoot = getElemento(xmlDoc, 'NFe');
            if (!nfeRoot) nfeRoot = getElemento(xmlDoc, 'nfeProc');
            const infNFe = nfeRoot ? getElemento(nfeRoot, 'infNFe') : null;
            
            if (!infNFe) return erros;
            
            const dets = [];
            const detsFromNS = infNFe.getElementsByTagNameNS(NS_NFE, 'det');
            if (detsFromNS.length > 0) {
                for (let i = 0; i < detsFromNS.length; i++) dets.push(detsFromNS[i]);
            } else {
                const detsFromTag = infNFe.getElementsByTagName('det');
                for (let i = 0; i < detsFromTag.length; i++) dets.push(detsFromTag[i]);
            }
            
            dets.forEach(det => {
                const prod = getElemento(det, 'prod');
                const imposto = getElemento(det, 'imposto');
                const icmsContainer = imposto ? getElemento(imposto, 'ICMS') : null;
                
                if (prod) {
                    const vProd = parseFloat(getTextoElemento(prod, 'vProd')) || 0;
                    somaVProd += vProd;
                }
                
                if (icmsContainer) {
                    const icmsTags = ['ICMS00', 'ICMS10', 'ICMS20', 'ICMS40', 'ICMS41', 'ICMS60', 
                                      'ICMS90', 'ICMS30', 'ICMS50', 'ICMS51', 'ICMS53', 'ICMS70'];
                    let vICMS = 0;
                    for (let tag of icmsTags) {
                        const elem = getElemento(icmsContainer, tag);
                        if (elem) {
                            vICMS = parseFloat(getTextoElemento(elem, 'vICMS')) || 0;
                            break;
                        }
                    }
                    const csosnTags = ['ICMSSN102','ICMSSN103','ICMSSN201','ICMSSN202','ICMSSN500','ICMSSN900'];
                    for (let tag of csosnTags) {
                        const elem = getElemento(icmsContainer, tag);
                        if (elem) {
                            vICMS = parseFloat(getTextoElemento(elem, 'vICMS')) || 0;
                            break;
                        }
                    }
                    somaVICMS += vICMS;
                }
            });
            
            const total = getElemento(infNFe, 'total');
            const icmsTot = total ? getElemento(total, 'ICMSTot') : null;
            if (icmsTot) {
                const vProdTotal = parseFloat(getTextoElemento(icmsTot, 'vProd')) || 0;
                const vICMSTotal = parseFloat(getTextoElemento(icmsTot, 'vICMS')) || 0;
                
                const somaVProdArred = Math.round(somaVProd * 100) / 100;
                const vProdTotalArred = Math.round(vProdTotal * 100) / 100;
                if (Math.abs(somaVProdArred - vProdTotalArred) > 0.01) {
                    erros.push({
                        erro: 'Rejeição 528',
                        mensagem: `Total de vProd no ICMSTot (${vProdTotal.toFixed(2)}) difere da soma dos itens (${somaVProdArred.toFixed(2)})`,
                        item: null
                    });
                }
                
                const somaVICMSArred = Math.round(somaVICMS * 100) / 100;
                const vICMSTotalArred = Math.round(vICMSTotal * 100) / 100;
                if (Math.abs(somaVICMSArred - vICMSTotalArred) > 0.01) {
                    erros.push({
                        erro: 'Rejeição 531',
                        mensagem: `Total de vICMS no ICMSTot (${vICMSTotal.toFixed(2)}) difere da soma dos itens (${somaVICMSArred.toFixed(2)})`,
                        item: null
                    });
                }
            }
            
            return erros;
        }
        
        /**
         * Valida o telefone do emitente
         * @param {string} fone - Telefone do emitente
         * @returns {Array} Lista de erros encontrados
         */
        function validarTelefoneEmitente(fone) {
            const erros = [];
            if (!fone) return erros;
            
            // Remove caracteres não numéricos
            const foneLimpo = fone.replace(/\D/g, '');
            
            if (foneLimpo.length < 8) {
                erros.push({
                    erro: 'Telefone da LOJA Inválido',
                    mensagem: 'Erro: Telefone da loja incorreto, ou faltando dígitos, verifique no cadastro no ERP.',
                    item: null
                });
            }
            
            return erros;
        }

        /**
         * Valida o telefone do emitente
         * @param {string} fone - Telefone do emitente
         * @returns {Array} Lista de erros encontrados
         */
        function validarTelefoneDestinatario(fone) {
            const erros = [];
            if (!fone) return erros;
            
            // Remove caracteres não numéricos
            const foneLimpo = fone.replace(/\D/g, '');
            
            if (foneLimpo.length < 8) {
                erros.push({

        /**
         * Valida o NCM usando a Brasil API (mais confiável)
         * @param {string} ncm - NCM a ser validado
         * @returns {Promise<{valido: boolean, descricao?: string}>} Resultado da validação
         */
        async function validarNCM(ncm) {
            if (!ncm) {
                return { valido: false, tipo: 'invalido' };
            }

            // Sanitiza o NCM (remove caracteres não numéricos)
            const ncmLimpo = ncm.replace(/\D/g, '');

            // Valida comprimento (NCM deve ter 8 dígitos)
            if (ncmLimpo.length !== 8) {
                return { valido: false, tipo: 'invalido' };
            }

            try {
                // Consulta a Brasil API para verificar se o NCM existe
                const response = await fetch(`https://brasilapi.com.br/api/ncm/v1/${ncmLimpo}`);
                
                if (response.status === 404) {
                    // NCM não existe na base oficial
                    return { valido: false, tipo: 'inexistente' };
                }
                
                if (!response.ok) {
                    // Outros erros da API
                    return { valido: false, tipo: 'invalido' };
                }

                const data = await response.json();
                
                // Se a API retornar dados, o NCM é válido
                if (data && data.codigo) {
                    return { 
                        valido: true, 
                        descricao: data.descricao 
                    };
                }

                return { valido: false, tipo: 'invalido' };
            } catch (error) {
                // Se houver erro na requisição (ex: sem conexão), não exibe falso alerta
                log(`Erro ao validar NCM ${ncmLimpo}: ${error.message}`, 'warn');
                return { valido: true }; // Assume válido se a API estiver indisponível
            }
        }
        
        /**
         * Normaliza texto para comparação (remove acentos e converte para maiúsculas)
         * @param {string} texto - Texto a ser normalizado
         * @returns {string} Texto normalizado
         */
        function normalizarTexto(texto) {
            if (!texto) return '';
            return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
        }
        
        /**
         * Arredonda um valor para 2 casas decimais com precisão alta, evitando erros de ponto flutuante
         * @param {number} valor - Valor a ser arredondado
         * @returns {number} Valor arredondado para 2 casas decimais
         */
        function arredondarParaDuasCasas(valor) {
            return Math.round(valor * 100) / 100;
        }

        /**
         * Converte um valor decimal para centavos (inteiro) para evitar erros de ponto flutuante
         * @param {number} valor - Valor decimal a ser convertido
         * @returns {number} Valor em centavos (inteiro, arredondado para centavo mais próximo)
         */
        function paraCentavos(valor) {
            return Math.round(parseFloat(valor) * 100);
        }

        /**
         * Converte centavos para valor decimal
         * @param {number} centavos - Valor em centavos (inteiro)
         * @returns {number} Valor decimal
         */
        function paraDecimal(centavos) {
            return centavos / 100;
        }

        /**
         * Calcula o valor do imposto (PIS/COFINS) usando centavos para evitar erros de ponto flutuante
         * @param {number} vBC - Base de cálculo do imposto
         * @param {number} pImposto - Aliquota do imposto (%)
         * @returns {number} Valor do imposto em centavos (inteiro)
         */
        function calcularImpostoCentavos(vBC, pImposto) {
            const vBCCentavos = paraCentavos(vBC);
            // Multiplicação exata usando centavos para evitar erros de ponto flutuante
            const valorCalculadoCentavos = Math.round(vBCCentavos * pImposto / 100);
            return valorCalculadoCentavos;
        }

        /**
         * Calcula o valor do imposto (PIS/COFINS) com alta precisão, validando base e valor
         * @param {number} vBC - Base de cálculo do imposto
         * @param {number} pImposto - Aliquota do imposto (%)
         * @param {number} vImposto - Valor do imposto informado no XML
         * @param {string} tipo - 'PIS' ou 'COFINS'
         * @param {number} nItem - Número do item
         * @returns {Array} Lista de mensagens de erro/aviso
         */
        function validarArredondamentoImposto(vBC, pImposto, vImposto, tipo, nItem, itemRef) {
            const mensagens = [];
            const vBCNum = parseFloat(vBC) || 0;
            const pImpostoNum = parseFloat(pImposto) || 0;
            const vImpostoNum = parseFloat(vImposto) || 0;

            if (vBCNum > 0 && pImpostoNum > 0) {
                const vImpostoCalculado = arredondarParaDuasCasas(vBCNum * (pImpostoNum / 100));
                if (Math.abs(vImpostoCalculado - vImpostoNum) > 0.00001) {
                    let prefixo = `Item ${nItem}`;
                    let cProd = 'N/A', xProd = 'N/A';
                    if (itemRef && itemRef.xProd) {
                        prefixo = `[Item ${nItem} - ${itemRef.xProd} (Cód: ${itemRef.cProd})]`;
                        cProd = itemRef.cProd;
                        xProd = itemRef.xProd;
                    }
                    mensagens.push({
                        tipo: 'error',
                        erro: `Divergência de Arredondamento de ${tipo}`,
                        desc: `${prefixo} Valor de ${tipo} calculado é R$ ${vImpostoCalculado.toFixed(2)}, mas foi informado R$ ${vImpostoNum.toFixed(2)}`,
                        motivo: `Cálculo: ${vBCNum.toFixed(2)} * ${pImpostoNum.toFixed(2)}% = ${vImpostoCalculado.toFixed(2)}`,
                        correcao: `Ajustar o valor de ${tipo} para R$ ${vImpostoCalculado.toFixed(2)}`,
                        orientacao: obterSugestaoContabil(
                            tipo === 'PIS' ? 'Divergência de Arredondamento de PIS (Rejeição 602 Provável)' : 'Divergência de Arredondamento de COFINS ',
                            cProd,
                            xProd
                        ),
                        campos: [tipo === 'PIS' ? 'vPIS' : 'vCOFINS'],
                        itemSuspeito: itemRef ? { nItem, xProd: itemRef.xProd, cProd: itemRef.cProd } : null
                    });
                }
            }

            return mensagens;
        }

        /**
         * Valida consistência de PIS/COFINS entre itens de MESMO NCM.
         * Detecta cenários como: Item 1 = NCM 21069090 / CST PIS 01 vs Item 2 = NCM 21069090 / CST PIS 07
         * Marca o item da minoria (fora do padrão) como suspeito.
         * @param {Object} dados - Dados processados do XML
         * @returns {Array} Lista de inconsistências encontradas
         */
        function validarConsistenciaPISCofinsPorNCM(dados) {
            const inconsistencias = [];
            try {
                if (!dados.itens || dados.itens.length < 2) return inconsistencias;

                const gruposPorNCM = {};
                dados.itens.forEach(item => {
                    const ncm = (item.NCM || '').trim();
                    if (!ncm) return;
                    if (!gruposPorNCM[ncm]) gruposPorNCM[ncm] = [];
                    gruposPorNCM[ncm].push(item);
                });

                for (const [ncm, itensDoNCM] of Object.entries(gruposPorNCM)) {
                    if (itensDoNCM.length < 2) continue;

                    const combosPIS = {};
                    const combosCOFINS = {};
                    itensDoNCM.forEach(item => {
                        const chavePIS = `${item.CST_PIS || 'Vazio'}|${item.pPIS || '0'}|${item.vBCPIS || '0'}`;
                        const chaveCOFINS = `${item.CST_COFINS || 'Vazio'}|${item.pCOFINS || '0'}|${item.vBCCOFINS || '0'}`;
                        if (!combosPIS[chavePIS]) combosPIS[chavePIS] = [];
                        combosPIS[chavePIS].push(item);
                        if (!combosCOFINS[chaveCOFINS]) combosCOFINS[chaveCOFINS] = [];
                        combosCOFINS[chaveCOFINS].push(item);
                    });

                    const qtdCombosPIS = Object.keys(combosPIS).length;
                    const qtdCombosCOFINS = Object.keys(combosCOFINS).length;

                    if (qtdCombosPIS <= 1 && qtdCombosCOFINS <= 1) continue;

                    const combosAnalisar = [];
                    if (qtdCombosPIS > 1) combosAnalisar.push({ tipo: 'PIS', combos: combosPIS });
                    if (qtdCombosCOFINS > 1) combosAnalisar.push({ tipo: 'COFINS', combos: combosCOFINS });

                    combosAnalisar.forEach(({ tipo, combos }) => {
                        const listaCombos = Object.entries(combos);
                        const comboPadrao = listaCombos.reduce((a, b) => a[1].length >= b[1].length ? a : b);
                        const [chavePadrao, itensPadrao] = comboPadrao;
                        const [cstPadrao, pPadrao, vBCPadrao] = chavePadrao.split('|');

                        listaCombos.forEach(([chave, itensSuspeitos]) => {
                            if (chave === chavePadrao) return;
                            if (itensSuspeitos.length >= itensPadrao.length) return;

                            const [cstSuspeito, pSuspeito, vBCSuspeito] = chave.split('|');
                            const pPadraoNum = parseFloat(pPadrao) || 0;

                            itensSuspeitos.forEach(item => {
                                const vProd = parseFloat(item.vProd) || 0;
                                const vBCSuspeitoNum = parseFloat(vBCSuspeito) || 0;
                                const valorEsperadoBC = (vBCPadrao !== '0' && vBCSuspeitoNum === 0 && vProd > 0) ? vProd : vBCSuspeitoNum;
                                const pSuspeitoNum = parseFloat(pSuspeito) || 0;
                                const aliquotaUsar = (pPadraoNum > 0) ? pPadraoNum : (pSuspeitoNum > 0 ? pSuspeitoNum : (tipo === 'PIS' ? 0.65 : 3.00));
                                const valorEsperadoImposto = arredondarParaDuasCasas(valorEsperadoBC * (aliquotaUsar / 100));
                                const idItem = `[Item ${item.nItem} - ${item.xProd} (Cód: ${item.cProd})]`;

                                const outrosItens = itensDoNCM.filter(i => i.nItem !== item.nItem);
                                const resumoOutros = outrosItens
                                    .map(i => `Item ${i.nItem} (${i.xProd.trim()}) = CST ${tipo} ${i['CST_' + tipo] || 'Vazio'} / ${i['p' + tipo] || '0'}%`)
                                    .join(' | ');

                                inconsistencias.push({
                                    tipo: 'error',
                                    erro: 'INCONSISTENCIA_PIS_COFINS_MESMO_NCM',
                                    desc: `${idItem} NCM ${ncm}: Este item tem CST ${tipo} ${cstSuspeito || 'Vazio'} (${tipo === 'PIS' ? 'Isento/NT' : 'Isento/NT'}) enquanto ${itensPadrao.length} outro(s) item(ns) do MESMO NCM ${ncm} utilizam CST ${tipo} ${cstPadrao}.`,
                                    motivo: `Divergência de tratamento tributário dentro da mesma classificação NCM. Outros itens: ${resumoOutros}`,
                                    correcao: `Altere o CST de ${tipo} do item para ${cstPadrao} (padrão do NCM ${ncm}), defina alíquota de ${aliquotaUsar.toFixed(2)}% e preencha ${tipo} no valor esperado de R$ ${valorEsperadoImposto.toFixed(2)}.`,
                                    orientacao: obterSugestaoContabil('INCONSISTENCIA_PIS_COFINS_MESMO_NCM', item.cProd, item.xProd),
                                    rejeicao: '603',
                                    campos: ['CST_' + tipo, 'p' + tipo, 'vBC' + tipo, 'v' + tipo],
                                    itemSuspeito: { nItem: item.nItem, xProd: item.xProd, cProd: item.cProd }
                                });
                            });
                        });
                    });
                }
            } catch (erro) {
                log(`Erro em validarConsistenciaPISCofinsPorNCM: ${erro.message}`, 'error');
            }
            return inconsistencias;
        }

        /**
         * Validação estrita de totais de PIS/COFINS (Regra de Corte Principal)
         * @param {Object} dados - Dados processados do XML
         * @returns {Array} Lista de erros encontrados
         */
        function validarTotaisFiscaisEstritos(dados) {
            const erros = [];

            try {
                const cstTributavel = ['01', '02'];
                const cstNaoTributaveisSuspeitos = ['06', '07', '08', '09', '49', '99'];
                let totalPISCalculadoCentavos = 0;
                let totalCOFINSCalculadoCentavos = 0;

                const aliquotasPadrao = {
                    PIS: { p: 0.65, nome: 'Regime Cumulativo (Lucro Presumido)' },
                    COFINS: { p: 3.00, nome: 'Regime Cumulativo (Lucro Presumido)' }
                };

                // 1) Passagem de validações individuais por item + totais acumulados
                dados.itens.forEach(item => {
                    const idItem = `[Item ${item.nItem} - ${item.xProd} (Cód: ${item.cProd})]`;

                    // PIS individual
                    if (cstTributavel.includes(item.CST_PIS)) {
                        const vBCPIS = parseFloat(item.vBCPIS) || 0;
                        const pPIS = parseFloat(item.pPIS) || 0;
                        const vPISInformado = parseFloat(item.vPIS) || 0;
                        const vPISCalculadoCentavos = calcularImpostoCentavos(vBCPIS, pPIS);
                        const vPISCalculado = paraDecimal(vPISCalculadoCentavos);
                        const vPISInformadoCentavos = paraCentavos(vPISInformado);

                        if (vPISCalculadoCentavos !== vPISInformadoCentavos) {
                            erros.push({
                                tipo: 'error',
                                erro: 'Divergência de Arredondamento de PIS (Rejeição 602 Provável)',
                                desc: `${idItem} PIS calculado é R$ ${vPISCalculado.toFixed(2)}, mas foi informado R$ ${vPISInformado.toFixed(2)}`,
                                motivo: `Cálculo exato: vBCPIS (R$ ${vBCPIS.toFixed(2)}) * (${pPIS.toFixed(2)}%) = R$ ${vPISCalculado.toFixed(2)}`,
                                correcao: `Ajustar vPIS para R$ ${vPISCalculado.toFixed(2)}`,
                                orientacao: obterSugestaoContabil('Divergência de Arredondamento de PIS (Rejeição 602 Provável)', item.cProd, item.xProd),
                                campos: ['vPIS'],
                                itemSuspeito: { nItem: item.nItem, xProd: item.xProd, cProd: item.cProd }
                            });
                        }
                        totalPISCalculadoCentavos += vPISCalculadoCentavos;
                    }

                    // COFINS individual
                    if (cstTributavel.includes(item.CST_COFINS)) {
                        const vBCCOFINS = parseFloat(item.vBCCOFINS) || 0;
                        const pCOFINS = parseFloat(item.pCOFINS) || 0;
                        const vCOFINSInformado = parseFloat(item.vCOFINS) || 0;
                        const vCOFINSCalculadoCentavos = calcularImpostoCentavos(vBCCOFINS, pCOFINS);
                        const vCOFINSCalculado = paraDecimal(vCOFINSCalculadoCentavos);
                        const vCOFINSInformadoCentavos = paraCentavos(vCOFINSInformado);

                        if (vCOFINSCalculadoCentavos !== vCOFINSInformadoCentavos) {
                            erros.push({
                                tipo: 'error',
                                erro: 'Divergência de Arredondamento de COFINS ',
                                desc: `${idItem} COFINS calculado é R$ ${vCOFINSCalculado.toFixed(2)}, mas foi informado R$ ${vCOFINSInformado.toFixed(2)}`,
                                motivo: `Cálculo exato: vBCCOFINS (R$ ${vBCCOFINS.toFixed(2)}) * (${pCOFINS.toFixed(2)}%) = R$ ${vCOFINSCalculado.toFixed(2)}`,
                                correcao: `Ajustar vCOFINS para R$ ${vCOFINSCalculado.toFixed(2)}`,
                                orientacao: obterSugestaoContabil('Divergência de Arredondamento de COFINS ', item.cProd, item.xProd),
                                campos: ['vCOFINS'],
                                itemSuspeito: { nItem: item.nItem, xProd: item.xProd, cProd: item.cProd }
                            });
                        }
                        totalCOFINSCalculadoCentavos += vCOFINSCalculadoCentavos;
                    }
                });

                const totalPISCalculado = paraDecimal(totalPISCalculadoCentavos);
                const totalCOFINSCalculado = paraDecimal(totalCOFINSCalculadoCentavos);
                const totalPISDeclarado = parseFloat(dados.totals.icmstot.vPIS) || 0;
                const totalCOFINSDeclarado = parseFloat(dados.totals.icmstot.vCOFINS) || 0;
                const totalPISDeclaradoCentavos = paraCentavos(totalPISDeclarado);
                const totalCOFINSDeclaradoCentavos = paraCentavos(totalCOFINSDeclarado);

                // 2) Função auxiliar: identifica item SUSPEITO (não tributado na prática) que,
                //    se tributado com CST 01 e alíquota padrão, fecha exatamente a diferença.
                function identificarItemCulpadoPorImpostoFaltante(tipo) {
                    const pPadrao = aliquotasPadrao[tipo].p;
                    const totalCalcCentavos = tipo === 'PIS' ? totalPISCalculadoCentavos : totalCOFINSCalculadoCentavos;
                    const totalDeclCentavos = tipo === 'PIS' ? totalPISDeclaradoCentavos : totalCOFINSDeclaradoCentavos;
                    const faltaCentavos = totalDeclCentavos - totalCalcCentavos;
                    if (faltaCentavos <= 0) return null;

                    let melhorCandidato = null;
                    let menorDiferenca = Infinity;

                    dados.itens.forEach(item => {
