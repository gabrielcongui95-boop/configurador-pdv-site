    <style>
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-modal: #252525;
            --bg-input: #2d2d2d;
            --border: #333333;
            --primary: #2e7d32;
            --primary-accent: #4caf50;
            --primary-light: #1b381e;
            --danger: #ef5350;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 40px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background-color: #1b2e1e;
            color: var(--text-main);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        /* Banner de Total */
        .total-banner {
            background: linear-gradient(135deg, #1b5e20, #003300);
            color: #ffffff;
            text-align: center;
            border-radius: 16px;
            padding: 22px 16px;
            margin-bottom: 16px;
            border: 1px solid #2e7d32;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .total-banner span {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #a5d6a7;
        }

        .total-banner h1 {
            font-size: 2.6rem;
            margin-top: 4px;
            color: #ffffff;
            font-weight: 700;
        }

        .market-info {
            font-size: 0.95rem;
            margin-top: 6px;
            color: #c8e6c9;
            font-style: italic;
        }

        /* Botões Principais */
        .main-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            opacity: 0.85;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-secondary {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: #fff;
        }

        /* Lista Ativa */
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .item-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
        }

        .item-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .item-obs {
            font-size: 0.8rem;
            color: #81c784;
            font-style: italic;
            margin-top: 2px;
        }

        .btn-remove {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.2rem;
            padding: 6px;
            cursor: pointer;
            margin-left: 8px;
        }

        .empty-cart {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            line-height: 1.5;
        }

        /* Modais */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: var(--bg-modal);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 1.2rem;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            font-weight: bold;
        }

        .modal-body {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
            margin-bottom: 14px;
        }

        /* Busca no Catálogo + Botão Adicionar Customizado */
        .search-bar-container {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .search-bar-container input {
            flex: 1;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
        }

        .search-bar-container input:focus {
            border-color: var(--primary-accent);
        }

        .btn-add-custom {
            background-color: var(--primary-accent);
            color: #000;
            width: 46px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Categorias e Itens do Catálogo */
        .category-header {
            color: var(--primary-accent);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 16px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .category-header:first-child {
            margin-top: 0;
        }

        .catalog-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .catalog-row:active {
            border-color: var(--primary-accent);
        }

        .catalog-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary-accent);
            cursor: pointer;
        }

        .catalog-row-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        /* Formulários gerais em Modais */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary-accent);
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-qty {
            background: var(--primary-light);
            color: var(--primary-accent);
            border: 1px solid var(--primary);
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-value {
            font-size: 1.3rem;
            font-weight: bold;
            width: 40px;
            text-align: center;
            color: var(--text-main);
        }

        /* Resumo Final */
        .summary-list {
            list-style: none;
            margin: 10px 0;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.95rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>

    <div class="container">
        <!-- Banner de Total -->
        <div class="total-banner">
            <span>Total da Compra</span>
            <h1 id="total-display">R$ 0,00</h1>
            <div id="market-display" class="market-info" onclick="openMarketModal()" style="cursor: pointer;">
            
            </div>
        </div>

        <!-- Ações Principais -->
        <div class="main-actions">
            <button class="btn btn-primary" onclick="openCatalogModal()">✏️ Fazer Lista</button>
            <button class="btn btn-danger" onclick="showSummaryBeforeReset()">🔄 Zerar Lista</button>
        </div>

        <!-- Lista do Carrinho -->
        <div class="card">
            <div class="cart-header">
                <h3>Itens Selecionados (<span id="cart-count">0</span>)</h3>
            </div>
            
            <!-- Campo de busca na lista atual -->
            <div class="search-bar-container" style="margin-bottom: 12px;">
                <input type="text" id="home-cart-search" placeholder="🔍 Buscar na lista atual..." oninput="renderUI()">
            </div>

            <div id="cart-list">
                <div class="empty-cart">
                    Carregando dados em tempo real...
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Catálogo / Fazer Lista -->
    <div id="modal-catalog" class="modal hidden">
        <div class="modal-content">
            <div class="modal-title">
                <span>📋 Selecione os Itens</span>
                <button class="close-btn" onclick="closeCatalogModal()">&times;</button>
            </div>

            <div class="search-bar-container">
                <input type="text" id="catalog-search" placeholder="Buscar ou adicionar item..." oninput="renderCatalog()" onkeypress="handleSearchKeyPress(event)">
                <button class="btn-add-custom" onclick="addCustomItem()" title="Adicionar item não listado">+</button>
            </div>

            <div class="modal-body" id="catalog-container">
                <!-- Categorias e checkboxes inseridos via JS -->
            </div>

            <button class="btn btn-primary" onclick="closeCatalogModal()">Concluir Seleção</button>
        </div>
    </div>

    <!-- Modal: Detalhes do Item (Preço / Quantidade) -->
    <div id="modal-item" class="modal hidden">
        <div class="modal-content">
            <div class="modal-title">
                <div>
                    <span id="modal-item-emoji"></span>
                    <span id="modal-item-name"></span>
                </div>
                <button class="close-btn" onclick="closeItemModal()">&times;</button>
            </div>
            
            <div class="form-group">
                <label for="item-price">Valor Unitário (R$)</label>
                <input type="number" id="item-price" step="0.01" inputmode="decimal" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Quantidade</label>
                <div class="qty-control">
                    <button class="btn-qty" onclick="changeQty(-1)">-</button>
                    <span id="item-qty" class="qty-value">1</span>
                    <button class="btn-qty" onclick="changeQty(1)">+</button>
                </div>
            </div>

            <div class="form-group">
                <label for="item-obs">Observação (Opcional)</label>
                <input type="text" id="item-obs" placeholder="Ex: Marca X, 200g, promoção...">
            </div>

            <button class="btn btn-primary" onclick="saveItemDetails()">Salvar no Carrinho</button>
            <button class="btn btn-secondary" style="margin-top: 8px;" onclick="closeItemModal()">Cancelar</button>
        </div>
    </div>

    <!-- Modal: Nome do Mercado -->
    <div id="modal-market" class="modal hidden">
        <div class="modal-content">
            <div class="modal-title">
                <span>🏪 Nome do Mercado</span>
                <button class="close-btn" onclick="closeMarketModal()">&times;</button>
            </div>
            <div class="form-group">
                <label for="market-name-input">Onde você está comprando?</label>
                <input type="text" id="market-name-input" placeholder="Ex: Supermercado Silva">
            </div>
            <button class="btn btn-primary" onclick="confirmMarketName()">Salvar</button>
        </div>
    </div>

    <!-- Modal: Resumo antes de Zerar -->
    <div id="modal-summary" class="modal hidden">
        <div class="modal-content">
            <div class="modal-title">
                <span>📊 Resumo da Lista</span>
                <button class="close-btn" onclick="closeSummaryModal()">&times;</button>
            </div>

            <div class="modal-body">
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">
                    Confira os itens selecionados antes de reiniciar:
                </p>
                <div id="summary-content"></div>
            </div>

            <button class="btn btn-danger" onclick="confirmReset()">Confirmar e Zerar Lista</button>
            <button class="btn btn-secondary" style="margin-top: 8px;" onclick="closeSummaryModal()">Voltar</button>
        </div>
    </div>

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            if (!container) return;
            const query = document.getElementById('catalog-search').value.toLowerCase().trim();
            container.innerHTML = '';

            const catalog = getFullCatalog();
            const grouped = {};

            catalog.forEach(item => {
                if (item.name.toLowerCase().includes(query)) {
                    if (!grouped[item.category]) {
                        grouped[item.category] = [];
                    }
                    grouped[item.category].push(item);
                }
            });

            const categories = Object.keys(grouped);

            if (categories.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">Nenhum item encontrado.<br>Clique no botão <strong>+</strong> para adicionar.</div>`;
                return;
            }

            categories.forEach(category => {
                const catHeader = document.createElement('div');
                catHeader.className = 'category-header';
                catHeader.innerText = category;
                container.appendChild(catHeader);

                grouped[category].forEach(item => {
                    const isSelected = state.cart.some(cartItem => cartItem.name === item.name);
                    
                    const row = document.createElement('label');
                    row.className = 'catalog-row';
                    row.innerHTML = `
                        <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleCartItem('${item.name}')">
                        <div class="catalog-row-info">
                            <span>${item.emoji || '📦'}</span>
                            <span>${item.name}</span>
                        </div>
                    `;
                    container.appendChild(row);
                });
            });
        }

        function toggleCartItem(itemName) {
            const index = state.cart.findIndex(i => i.name === itemName);

            if (index > -1) {
                state.cart.splice(index, 1);
            } else {
                const fullCatalog = getFullCatalog();
                const itemObj = fullCatalog.find(i => i.name === itemName);
                if (itemObj) {
                    state.cart.push({
                        ...itemObj,
                        price: 0,
                        quantity: 1,
                        obs: ""
                    });
                }
            }

            saveState();
        }

        function addCustomItem() {
            const searchInput = document.getElementById('catalog-search');
            const name = searchInput.value.trim();

            if (!name) {
                alert("Digite o nome do produto para adicionar.");
                return;
            }

            const catalog = getFullCatalog();
            const exists = catalog.some(i => i.name.toLowerCase() === name.toLowerCase());

            if (!exists) {
                const newItem = {
                    id: Date.now(),
                    name: name,
                    category: "Outros / Personalizados",
                    emoji: "📦"
                };
                state.customItems.push(newItem);
            }

            if (!state.cart.some(i => i.name.toLowerCase() === name.toLowerCase())) {
                state.cart.push({
                    id: Date.now(),
                    name: name,
                    category: "Outros / Personalizados",
                    emoji: "📦",
                    price: 0,
                    quantity: 1,
                    obs: ""
                });
            }

            searchInput.value = '';
            saveState();
        }

        function handleSearchKeyPress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const searchVal = e.target.value.trim();
                if (searchVal) {
                    addCustomItem();
                }
            }
        }

        function openItemModal(cartIndex) {
            state.editingItemIndex = cartIndex;
            const item = state.cart[cartIndex];

            document.getElementById('modal-item-emoji').innerText = item.emoji || '📦';
            document.getElementById('modal-item-name').innerText = item.name;
            document.getElementById('item-price').value = item.price ? item.price : "";
            document.getElementById('item-obs').value = item.obs || "";
            state.currentQty = item.quantity || 1;
            document.getElementById('item-qty').innerText = state.currentQty;

            document.getElementById('modal-item').classList.remove('hidden');
            setTimeout(() => document.getElementById('item-price').focus(), 100);
        }

        function closeItemModal() {
            document.getElementById('modal-item').classList.add('hidden');
            state.editingItemIndex = null;
        }

        function changeQty(delta) {
            if (state.currentQty + delta >= 1) {
                state.currentQty += delta;
                document.getElementById('item-qty').innerText = state.currentQty;
            }
        }

        function saveItemDetails() {
            if (state.editingItemIndex === null) return;

            const priceInput = document.getElementById('item-price').value;
            const price = parseFloat(priceInput) || 0;
            const obs = document.getElementById('item-obs').value.trim();

            state.cart[state.editingItemIndex].price = price;
            state.cart[state.editingItemIndex].quantity = state.currentQty;
            state.cart[state.editingItemIndex].obs = obs;

            saveState();
            closeItemModal();
        }

        function removeFromCart(index) {
            state.cart.splice(index, 1);
            saveState();
        }

        }

        function closeSummaryModal() {
            document.getElementById('modal-summary').classList.add('hidden');
        }

        function confirmReset() {
            state.cart = [];
            state.marketName = "";
            saveState();
            closeSummaryModal();
        }
    </script>
</body>
</html>
